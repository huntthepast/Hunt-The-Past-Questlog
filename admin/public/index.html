                    </p>
                  </div>
                  <div class="flex items-center gap-2">
                    <button type="button" class="btn btn-sm" @click="$store.app.toggleList()" :aria-pressed="$store.app.listHidden" :title="$store.app.listHidden ? 'Show the list again' : 'Hide the list for a wider editor'">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5 text-amber-400"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
                      <span x-text="$store.app.listHidden ? 'Show list' : 'Hide list'"></span>
                    </button>
                    <a x-show="!isNew" :href="$store.app.siteUrl('/trackers/' + selected)" target="_blank" rel="noopener" class="btn btn-sm">View on dev site</a>
                    <button type="button" class="btn btn-sm" @click="close()">Close</button>
                    <button type="button" x-show="!isNew" class="btn btn-sm btn-danger" @click="remove()">Delete</button>
                    <button type="submit" class="btn btn-accent" :disabled="saving" x-text="saving ? 'Saving...' : 'Save'"></button>
                  </div>
                </div>

                <div class="card grid gap-4 p-4 sm:grid-cols-2 lg:grid-cols-4">
                  <label class="field lg:col-span-2"><span class="label">Title *</span><input class="input" x-model="form.title" required /></label>
                  <label class="field" x-show="isNew"><span class="label">Slug (optional)</span><input class="input font-mono" x-model.trim="form.slug" :placeholder="slugPreview || 'auto'" /></label>
                  <label class="field">
                    <span class="label">Type</span>
                    <select class="input" x-model="form.type">
                      <template x-for="t in $store.app.meta.trackerTypes" :key="t.id"><option :value="t.id" x-text="t.label"></option></template>
                    </select>
                  </label>
                  <label class="field lg:col-span-2">
                    <span class="label">Game</span>
                    <select class="input" x-model="form.game">
                      <option value="">Not tied to a game</option>
                      <template x-for="g in games" :key="g.slug"><option :value="g.slug" x-text="`${g.title} (${$store.app.platform(g.platform).short})`"></option></template>
                    </select>
                  </label>
                  <label class="field lg:col-span-2"><span class="label">Summary</span><input class="input" x-model="form.summary" /></label>
                  <label class="field">
                    <span class="label">Item layout</span>
                    <select class="input" x-model.number="form.checklistColumns" title="How items are laid out on the site (readers can change it)">
                      <option :value="1">Single column</option>
                      <option :value="2">2 columns</option>
                      <option :value="3">3 columns</option>
                    </select>
                  </label>
                  <label class="flex items-center gap-2 self-end pb-2 text-sm lg:col-span-3"><input type="checkbox" class="size-4 accent-amber-400" x-model="form.checklistCollapsed" /> Collapse sections by default</label>
                </div>

                <!-- Slim sticky bar: opens the Sections drawer (like the tracker page's sidebar) and folds/unfolds everything. -->
                <div class="sticky top-0 z-10 -mx-1 flex flex-wrap items-center gap-2 bg-zinc-950/95 px-1 py-2 text-xs backdrop-blur" data-section-strip x-show="form.sections.length > 1">
                  <button type="button" class="btn btn-sm" @click="ui.sections = true" :aria-expanded="ui.sections" aria-controls="tracker-sections-drawer" title="Jump to a section">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5 text-amber-400"><path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
                    Sections <span class="text-zinc-500" x-text="form.sections.length"></span>
                  </button>
                  <span class="text-zinc-500" x-text="`${progress(form).done} / ${progress(form).total} done`"></span>
                  <span class="ml-auto flex items-center gap-1 text-zinc-500">
                    <button type="button" class="cursor-pointer hover:text-amber-300" @click="setAllCollapsed(true)">Collapse all</button>
                    <span class="text-zinc-700">/</span>
                    <button type="button" class="cursor-pointer hover:text-amber-300" @click="setAllCollapsed(false)">Expand all</button>
                  </span>
                </div>

                <!-- Sections drawer -->
                <div x-show="ui.sections" x-cloak x-transition.opacity.duration.150ms class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm" @click="ui.sections = false" aria-hidden="true"></div>
                <aside
                  id="tracker-sections-drawer"
                  x-show="ui.sections"
                  x-cloak
                  x-transition:enter="transition duration-200 ease-out"
                  x-transition:enter-start="translate-x-full"
                  x-transition:enter-end="translate-x-0"
                  x-transition:leave="transition duration-150 ease-in"
                  x-transition:leave-start="translate-x-0"
                  x-transition:leave-end="translate-x-full"
                  class="fixed inset-y-0 right-0 z-50 flex w-[88vw] max-w-sm flex-col border-l border-zinc-800 bg-zinc-950 shadow-2xl"
                  aria-label="Tracker sections"
                >
                  <div class="flex items-center justify-between border-b border-zinc-800 px-4 py-3">
                    <p class="font-display text-xl text-zinc-100">Sections</p>
                    <button type="button" class="btn btn-sm" @click="ui.sections = false" aria-label="Close">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                  </div>
                  <ol class="min-h-0 flex-1 space-y-0.5 overflow-y-auto p-3 text-sm">
                    <template x-for="(section, si) in form.sections" :key="section._uid">
                      <li>
                        <button
                          type="button"
                          class="flex w-full items-baseline gap-2 rounded-md px-2 py-1.5 text-left transition hover:bg-zinc-900"
                          :class="isCollapsed(section) ? 'text-zinc-300' : 'bg-zinc-800/60 text-amber-300'"
                          @click="jumpTo(section); ui.sections = false"
                        >
                          <span class="shrink-0 font-mono text-[11px] text-zinc-500" x-text="String(si + 1).padStart(2, '0')"></span>
                          <span class="min-w-0 flex-1 truncate" x-text="section.title || 'Untitled'"></span>
                          <span class="shrink-0 text-[11px] tabular-nums" :class="section.items.length && sectionDone(section) === section.items.length ? 'text-emerald-300' : 'text-zinc-500'" x-text="`${sectionDone(section)}/${section.items.length}`"></span>
                        </button>
                      </li>
                    </template>
                  </ol>
                  <div class="flex items-center gap-2 border-t border-zinc-800 px-4 py-3 text-xs text-zinc-500">
                    <button type="button" class="cursor-pointer hover:text-amber-300" @click="setAllCollapsed(true)">Collapse all</button>
                    <span class="text-zinc-700">/</span>
                    <button type="button" class="cursor-pointer hover:text-amber-300" @click="setAllCollapsed(false)">Expand all</button>
                    <span class="ml-auto text-zinc-600">Open sections are highlighted</span>
                  </div>
                </aside>

                <div class="space-y-4">
                  <template x-for="(section, si) in form.sections" :key="section._uid">
                    <div class="card" :id="`tracker-section-${section._uid}`">
                      <div class="flex flex-wrap items-center gap-2 border-b border-zinc-800 px-3 py-2" :class="isCollapsed(section) && 'border-b-0'">
                        <button type="button" class="btn btn-sm px-1.5" @click="toggleSection(section)" :aria-expanded="!isCollapsed(section)" :title="isCollapsed(section) ? 'Show items' : 'Hide items'">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5 transition-transform" :class="!isCollapsed(section) && 'rotate-90'"><path d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
                        </button>
                        <span class="font-mono text-sm text-zinc-500" x-text="String(si + 1).padStart(2, '0')"></span>
                        <input class="input flex-1" x-model="section.title" placeholder="Section title (area, chapter, disc...)" required />
                        <span class="shrink-0 text-xs tabular-nums" :class="section.items.length && sectionDone(section) === section.items.length ? 'text-emerald-300' : 'text-zinc-500'" x-text="`${sectionDone(section)} / ${section.items.length}`" title="Done in this section"></span>
                        <button type="button" class="btn btn-sm" @click="setSectionDone(section, true)" :disabled="!section.items.length || sectionDone(section) === section.items.length" title="Mark every item in this section done">Tick all</button>
                        <button type="button" class="btn btn-sm" @click="setSectionDone(section, false)" :disabled="sectionDone(section) === 0" title="Mark every item in this section not done">Clear</button>
                        <span class="mx-1 h-4 w-px bg-zinc-800"></span>
                        <button type="button" class="btn btn-sm" @click="move(form.sections, si, si - 1)" :disabled="si === 0" title="Move up">&uarr;</button>
                        <button type="button" class="btn btn-sm" @click="move(form.sections, si, si + 1)" :disabled="si === form.sections.length - 1" title="Move down">&darr;</button>
                        <button type="button" class="btn btn-sm btn-danger" @click="removeSection(si)" title="Remove section">&times;</button>
                      </div>
                      <ul class="divide-y divide-zinc-800/80" x-show="!isCollapsed(section)">
                        <template x-for="(item, ii) in section.items" :key="ii">
                          <li class="flex items-start gap-2 px-3 py-2">
                            <input type="checkbox" class="mt-2.5 size-4 shrink-0 accent-amber-400" x-model="item.done" title="Done" />
                            <div class="grid flex-1 gap-1 sm:grid-cols-[1fr_1fr]">
                              <input class="input" x-model="item.label" placeholder="Item" required data-item-label @keydown.enter.prevent="addItem(section)" />
                              <input class="input" x-model="item.note" placeholder="Note / where / how (optional)" />
                            </div>
                            <div class="flex shrink-0 gap-1 pt-1">
                              <button type="button" class="btn btn-sm" @click="move(section.items, ii, ii - 1)" :disabled="ii === 0">&uarr;</button>
                              <button type="button" class="btn btn-sm" @click="move(section.items, ii, ii + 1)" :disabled="ii === section.items.length - 1">&darr;</button>
                              <button type="button" class="btn btn-sm btn-danger" @click="removeItem(section, ii)">&times;</button>
                            </div>
                          </li>
                        </template>
                      </ul>
                      <div class="flex flex-wrap items-start gap-2 border-t border-zinc-800 p-3" x-show="!isCollapsed(section)">
                        <button type="button" class="btn btn-sm" @click="addItem(section)">+ Add item</button>
                        <details class="text-xs text-zinc-500">
                          <summary class="cursor-pointer py-1 hover:text-zinc-300">Bulk add (one per line, optional "label | note")</summary>
                          <textarea class="input mt-2 min-h-24 w-96 font-mono" x-model="section.bulk" placeholder="Speed Tab | Behind the waterfall&#10;Magic Tab"></textarea>
                          <button type="button" class="btn btn-sm mt-2" @click="addBulk(section)">Add lines</button>
                        </details>
                      </div>
                    </div>
                  </template>
                  <button type="button" class="btn" @click="addSection()">+ Add section</button>
                </div>

                <!-- Credit for data that is not mine (a wiki, a fan site), plus the removal trail it feeds. -->
                <div class="border-t border-zinc-800 pt-4">
                  <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <span class="label mb-0">Sources &amp; credits</span>
                      <p class="text-xs text-zinc-500">Where the data came from, if you did not compile it yourself. Shown at the end of the tracker with a removal link, and listed on <code class="text-zinc-400">/credits</code>.</p>
                    </div>
                    <button type="button" class="btn btn-sm" @click="addSource()">+ Add source</button>
                  </div>
                  <div class="space-y-2">
                    <template x-for="(src, i) in form.sources" :key="i">
                      <div class="rounded-lg border border-zinc-800 bg-zinc-900/40 p-3">
                        <div class="flex flex-wrap items-center gap-2">
                          <input class="input sm:w-56" x-model="src.label" placeholder="Who to credit (Mega Man Wiki)" required />
                          <input class="input flex-1" x-model="src.url" placeholder="https://... (optional)" />
                          <input class="input sm:w-40" x-model="src.license" list="tracker-licenses" placeholder="Licence (optional)" />
                          <button type="button" class="btn btn-sm btn-danger" @click="form.sources.splice(i, 1)" aria-label="Remove source">&times;</button>
                        </div>
                        <input class="input mt-2 w-full" x-model="src.note" placeholder="What was taken (Chip numbers, names and codes were compiled there)" />
                      </div>
                    </template>
                  </div>
                  <datalist id="tracker-licenses">
                    <option value="CC BY 4.0"></option>
                    <option value="CC BY-SA"></option>
                    <option value="CC BY-NC"></option>
                    <option value="Public domain"></option>
                    <option value="Used with permission"></option>
                  </datalist>
                </div>
              </form>
            </template>
          </div>
        </section>
      </template>

      <!-- ===== Achievement sets (Steam sync + manual) ===== -->
      <template x-if="$store.app.ready && $store.app.view === 'sets'">
        <section x-data="setsView" class="grid gap-6" :class="!($store.app.listHidden && form) && 'xl:grid-cols-[320px_1fr]'">
          <div class="card flex max-h-[calc(100vh-4rem)] flex-col" x-show="!($store.app.listHidden && form)">
            <div class="flex items-center justify-between border-b border-zinc-800 px-3 py-3">
              <h1 class="h-display text-2xl">Achievements <span class="font-sans text-base text-zinc-500" x-text="`(${sets.length})`"></span></h1>
              <button type="button" class="btn btn-sm btn-accent" @click="create()">+ New set</button>
            </div>
            <div class="border-b border-zinc-800 p-3">
              <input type="search" class="input" x-model="q" placeholder="Search sets..." />
            </div>
            <ul class="min-h-0 flex-1 divide-y divide-zinc-800 overflow-y-auto">
              <template x-for="s in filtered" :key="s.slug">
                <li>
                  <button type="button" class="row w-full text-left" :class="selected === s.slug && 'row-active'" @click="open(s.slug)">
                    <span class="block truncate font-medium text-zinc-100" x-text="gameTitle(s.game)"></span>
                    <span class="block truncate text-xs text-zinc-500">
                      <span x-text="s.title"></span> &middot; <span x-text="s.source === 'steam' ? 'synced from Steam' : 'manual'"></span>
                      &middot; <span x-text="`${progress(s).done}/${progress(s).total}`"></span>
                    </span>
                  </button>
                </li>
              </template>
              <li x-show="filtered.length === 0" class="p-6 text-center text-sm text-zinc-500">No achievement sets yet. Link a game to Steam and sync, or add a manual set.</li>
            </ul>
          </div>

          <div class="space-y-6">
            <!-- Steam: shown while nothing is being edited -->
            <template x-if="!form">
              <div class="space-y-6">
                <div class="card p-4">
                  <div class="flex flex-wrap items-start justify-between gap-3">
                    <div>
                      <h2 class="h-display text-xl">Steam</h2>
                      <p class="mt-1 text-sm text-zinc-500" x-show="steam.status && !steam.status.configured">
                        Not configured. Put <code class="text-zinc-300">STEAM_API_KEY</code> and <code class="text-zinc-300">STEAM_ID</code> in <code class="text-zinc-300">.env</code> (see .env.example) and restart the admin. Your profile's "Game details" must be public.
                      </p>
                      <p class="mt-1 text-sm text-zinc-500" x-show="steam.status?.configured">
                        Syncs every library game that has a Steam app id: the full achievement list with your unlocks and Steam's playtime land in
                        <code class="text-zinc-300">src/content/achievement-sets/&lt;game&gt;-steam.json</code> and show up as a Steam tab on the game's page.
                      </p>
                    </div>
                    <div class="flex flex-wrap items-center gap-3" x-show="steam.status?.configured">
                      <label class="flex items-center gap-2 text-sm text-zinc-400" title="Hours from Steam's playtime (only ever raised). Written to the game when it has no RetroAchievements link, otherwise to the Steam set's own journal.">
                        <input type="checkbox" class="size-4 accent-amber-400" x-model="steam.autoHours" /> Update hours played
                      </label>
                      <label class="flex items-center gap-2 text-sm text-zinc-400" title="Empty Started = first unlock; empty Finished = the day the last achievement was unlocked (when all are).">
                        <input type="checkbox" class="size-4 accent-amber-400" x-model="steam.autoDates" /> Fill in dates
                      </label>
                      <label class="flex items-center gap-2 text-sm text-zinc-400" title="Games without an RA link: Played once there is playtime or an unlock, Completed when every achievement is unlocked. Never downgrades.">
                        <input type="checkbox" class="size-4 accent-amber-400" x-model="steam.autoStatus" /> Auto-upgrade statuses
                      </label>
                      <button type="button" class="btn btn-accent" :disabled="steam.job?.running" @click="sync()" x-text="steam.job?.running ? 'Syncing...' : 'Sync now'"></button>
                    </div>
                  </div>

                  <template x-if="steam.job && (steam.job.running || steam.job.log.length)">
                    <div class="mt-4">
                      <div class="mb-1 flex items-center justify-between text-xs text-zinc-500">
                        <span x-text="steam.job.running ? `Syncing ${steam.job.progress.done}/${steam.job.progress.total}...` : (steam.job.error ? 'Failed' : 'Finished')"></span>
                        <span x-text="steamProgressPct + '%'"></span>
                      </div>
                      <div class="h-1.5 w-full overflow-hidden rounded-full bg-zinc-800"><div class="h-full bg-amber-400 transition-all" :style="`width:${steamProgressPct}%`"></div></div>
                      <pre x-ref="steamLog" class="mt-3 max-h-56 overflow-y-auto rounded-lg border border-zinc-800 bg-zinc-950 p-3 font-mono text-[11px] leading-relaxed text-zinc-400" x-text="steam.job.log.join('\n')"></pre>
                    </div>
                  </template>
                </div>

                <div class="card p-4" x-show="steam.status?.configured">
                  <div class="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <h2 class="h-display text-xl">Import games from your Steam library</h2>
                      <p class="text-sm text-zinc-500">Adds library entries (PC platform, box art, developer, genres, year, hours from Steam playtime) for games you don't have yet.</p>
                    </div>
                    <button type="button" class="btn" :disabled="steam.loadingCandidates" @click="loadCandidates()" x-text="steam.loadingCandidates ? 'Loading...' : (steam.candidates ? 'Refresh list' : 'Find games to import')"></button>
                  </div>
                  <template x-if="steam.candidates">
                    <div class="mt-4">
                      <div class="flex flex-wrap items-center gap-2 text-sm">
                        <input type="search" class="input sm:w-64" x-model="steam.q" placeholder="Filter by title..." />
                        <span class="text-zinc-500" x-text="`${filteredCandidates.length} of ${steam.candidates.length} games`"></span>
                        <button type="button" class="btn btn-sm" @click="selectAll(true)">Select shown</button>
                        <button type="button" class="btn btn-sm" @click="selectAll(false)">Clear</button>
                        <button type="button" class="btn btn-sm btn-accent ml-auto" :disabled="!selectedCount || steam.importing" @click="importSelected()" x-text="steam.importing ? 'Importing...' : `Import ${selectedCount} selected`"></button>
                      </div>
                      <p x-show="!steam.candidates.length" class="mt-3 text-sm text-zinc-500">Everything on the Steam account is already in the library.</p>
                      <ul class="mt-3 max-h-[28rem] divide-y divide-zinc-800 overflow-y-auto rounded-lg border border-zinc-800">
                        <template x-for="c in filteredCandidates.slice(0, 400)" :key="c.appId">
                          <li class="flex items-center gap-3 px-3 py-2 text-sm">
                            <input type="checkbox" class="size-4 accent-amber-400" :checked="Boolean(steam.selection[c.appId])" @change="steam.selection[c.appId] = $event.target.checked" />
                            <img :src="c.icon || c.cover" alt="" class="size-8 shrink-0 rounded bg-zinc-800 object-cover" loading="lazy" />
                            <span class="min-w-0 flex-1">
                              <span class="block truncate font-medium text-zinc-100" x-text="c.title"></span>
                              <span class="block text-xs text-zinc-500" x-text="(c.playtimeMinutes ? `${hours(c.playtimeMinutes)} h played` : 'never played') + (c.lastPlayedAt ? ` · last ${$store.app.fmtDate(c.lastPlayedAt)}` : '')"></span>
                            </span>
                            <a :href="`https://store.steampowered.com/app/${c.appId}`" target="_blank" rel="noopener" class="text-xs text-amber-400 hover:underline">Store</a>
                          </li>
                        </template>
                      </ul>
                      <p x-show="filteredCandidates.length > 400" class="mt-2 text-xs text-zinc-500">Showing the first 400 - narrow it down with the filter.</p>
                      <template x-if="steam.importResult">
                        <div class="mt-3 text-sm">
                          <p class="text-emerald-300" x-text="`${steam.importResult.created.length} imported`"></p>
                          <ul class="mt-1 text-xs text-rose-300"><template x-for="e in steam.importResult.errors" :key="e.appId"><li x-text="`${e.appId}: ${e.message}`"></li></template></ul>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>

                <div class="card flex flex-col items-center justify-center gap-2 p-8 text-center text-zinc-500">
                  <p class="font-display text-2xl text-zinc-300">Manual sets</p>
                  <p class="max-w-xl text-sm">For GOG, consoles or anything without an API: pick a set on the left or start one. Type the achievements in, paste them in bulk, or pull the list from Steam by app id (GOG copies share it) and just tick what you have.</p>
                  <button type="button" class="btn btn-accent mt-2" @click="create()">+ New manual set</button>
                </div>
              </div>
            </template>

            <!-- editor -->
            <template x-if="form">
              <form class="space-y-4" @submit.prevent="save()">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 class="text-2xl font-bold tracking-tight text-zinc-50" x-text="isNew ? 'New achievement set' : `${gameTitle(form.game)} - ${form.title}`"></h2>
                    <p class="text-xs text-zinc-500">
                      <code class="text-zinc-300" x-text="`src/content/achievement-sets/${isNew ? (form.game && form.title ? form.game + '-' + form.title.toLowerCase().replace(/[^a-z0-9]+/g, '-') : '...') : selected}.json`"></code>
                      <span class="ml-2" x-text="`${progress(form).done}/${progress(form).total} unlocked`"></span>
                      <span x-show="form.source === 'steam'" class="ml-2 text-sky-300">synced from Steam - the list is refreshed by the sync, your journal stays</span>
                      <span x-show="dirty" class="ml-2 text-amber-300">&bull; unsaved</span>
                    </p>
                  </div>
                  <div class="flex items-center gap-2">
                    <button type="button" class="btn btn-sm" @click="$store.app.toggleList()" :aria-pressed="$store.app.listHidden" :title="$store.app.listHidden ? 'Show the list again' : 'Hide the list for a wider editor'">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5 text-amber-400"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
                      <span x-text="$store.app.listHidden ? 'Show list' : 'Hide list'"></span>
                    </button>
                    <a x-show="!isNew && form.game" :href="$store.app.siteUrl('/games/' + form.game + '#achievements')" target="_blank" rel="noopener" class="btn btn-sm">View on dev site</a>
                    <button type="button" class="btn btn-sm" @click="close()">Close</button>
                    <button type="button" x-show="!isNew" class="btn btn-sm btn-danger" @click="remove()">Delete</button>
                    <button type="submit" class="btn btn-accent" :disabled="saving" x-text="saving ? 'Saving...' : 'Save'"></button>
                  </div>
                </div>

                <div class="card grid gap-4 p-4 sm:grid-cols-2 lg:grid-cols-6">
                  <label class="field lg:col-span-2">
                    <span class="label">Game *</span>
                    <select class="input" x-model="form.game" required>
                      <option value="">Pick a game...</option>
                      <template x-for="g in games" :key="g.slug"><option :value="g.slug" x-text="`${g.title} (${$store.app.platform(g.platform).short})`"></option></template>
                    </select>
                  </label>
                  <label class="field lg:col-span-2"><span class="label">Tab label *</span><input class="input" x-model.trim="form.title" placeholder="GOG, Epic, PlayStation..." required /></label>
                  <label class="field">
                    <span class="label">Steam app id</span>
                    <div class="flex gap-2">
                      <input class="input" type="number" min="1" x-model="form.appId" placeholder="optional" :disabled="form.source === 'steam'" />
                    </div>
                  </label>
                  <div class="field">
                    <span class="label">&nbsp;</span>
                    <button type="button" class="btn w-full" :disabled="importingSchema || !form.appId || form.source === 'steam' || !$store.app.meta.steam?.configured" @click="importSchema()" :title="$store.app.meta.steam?.configured ? 'Pull the achievement list (names, descriptions, icons) of that Steam app into this set' : 'Needs STEAM_API_KEY in .env'" x-text="importingSchema ? 'Loading...' : 'Import list from Steam'"></button>
                  </div>
                  <label class="field lg:col-span-3"><span class="label">Link (View on ...)</span><input class="input" x-model.trim="form.url" placeholder="https://www.gog.com/game/..." /></label>
                  <label class="field lg:col-span-3" x-show="form.source === 'steam'"><span class="label">Playtime (minutes, from Steam)</span><input class="input" :value="form.playtimeMinutes" disabled /></label>
                </div>

                <fieldset class="card space-y-3 p-4">
                  <legend class="px-1 text-xs font-semibold uppercase tracking-wider text-amber-400/90">Your stats for this set</legend>
                  <p class="text-xs text-zinc-500">Shown when this set is not the game's primary one (a game on RetroAchievements keeps its own stats under the RA tab; otherwise the first set uses the game's stats and these are for extra sets).</p>
                  <div class="grid gap-3 sm:grid-cols-4">
                    <label class="field"><span class="label">Rating (0-10)</span><input class="input" type="number" min="0" max="10" step="0.5" x-model="form.journal.rating" /></label>
                    <label class="field"><span class="label">Hours played</span><input class="input" type="number" min="0" step="0.1" x-model="form.journal.hoursPlayed" /></label>
                    <label class="field"><span class="label">Started</span><input class="input" type="date" x-model="form.journal.startedAt" /></label>
                    <label class="field"><span class="label">Finished</span><input class="input" type="date" x-model="form.journal.finishedAt" /></label>
                    <label class="field sm:col-span-2"><span class="label">Review (markdown)</span><textarea class="input min-h-20" x-model="form.journal.review"></textarea></label>
                    <label class="field sm:col-span-2"><span class="label">Notes (markdown)</span><textarea class="input min-h-20" x-model="form.journal.notes"></textarea></label>
                  </div>
                </fieldset>

                <div class="card">
                  <div class="flex flex-wrap items-center gap-2 border-b border-zinc-800 px-3 py-2 text-xs">
                    <span class="font-semibold uppercase tracking-wider text-zinc-500">Achievements</span>
                    <span class="text-zinc-500" x-text="`${progress(form).done} / ${progress(form).total} unlocked`"></span>
                    <template x-if="form.source !== 'steam'">
                      <span class="ml-auto flex items-center gap-2">
                        <button type="button" class="btn btn-sm" @click="setAllUnlocked(true)" :disabled="!form.achievements.length || progress(form).done === progress(form).total">Tick all</button>
                        <button type="button" class="btn btn-sm" @click="setAllUnlocked(false)" :disabled="!progress(form).done">Clear</button>
                        <button type="button" class="btn btn-sm" @click="addAchievement()">+ Add achievement</button>
                      </span>
                    </template>
                  </div>

                  <!-- steam set: read-only list -->
                  <template x-if="form.source === 'steam'">
                    <ul class="divide-y divide-zinc-800/80">
                      <template x-for="a in form.achievements" :key="a.id">
                        <li class="flex items-center gap-3 px-3 py-2 text-sm" :class="!a.unlockedAt && 'opacity-60'">
                          <img :src="a.unlockedAt ? a.icon : (a.iconLocked || a.icon)" alt="" class="size-8 shrink-0 rounded bg-zinc-800" loading="lazy" />
                          <span class="min-w-0 flex-1">
                            <span class="block truncate font-medium text-zinc-100" x-text="a.hidden && !a.unlockedAt ? 'Hidden achievement' : a.title"></span>
                            <span class="block truncate text-xs text-zinc-500" x-text="a.description"></span>
                          </span>
                          <span class="shrink-0 text-xs" :class="a.unlockedAt ? 'text-emerald-300' : 'text-zinc-500'" x-text="a.unlockedAt ? $store.app.fmtDate(a.unlockedAt) : 'Locked'"></span>
                          <span class="w-12 shrink-0 text-right text-xs text-zinc-500" x-text="a.rarity !== '' && a.rarity !== null ? a.rarity + '%' : ''"></span>
                        </li>
                      </template>
                    </ul>
                  </template>

                  <!-- manual set: editable rows -->
                  <template x-if="form.source !== 'steam'">
                    <div>
                      <ul class="divide-y divide-zinc-800/80">
                        <template x-for="(a, i) in form.achievements" :key="i">
                          <li class="flex flex-wrap items-start gap-2 px-3 py-2 md:flex-nowrap">
                            <label class="mt-2 flex shrink-0 items-center gap-1 text-xs text-zinc-400" title="Unlocked">
                              <input type="checkbox" class="size-4 accent-amber-400" :checked="Boolean(a.unlockedAt)" @change="toggleUnlocked(a)" />
                            </label>
                            <img x-show="a.icon" :src="a.unlockedAt ? a.icon : (a.iconLocked || a.icon)" alt="" class="mt-1 size-8 shrink-0 rounded bg-zinc-800" loading="lazy" />
                            <div class="grid min-w-0 flex-1 gap-1 sm:grid-cols-[1fr_1.4fr_9rem]">
                              <input class="input" x-model="a.title" placeholder="Title" required data-achievement-title />
                              <input class="input" x-model="a.description" placeholder="Description" />
                              <input class="input" type="date" x-model="a.unlockedAt" title="Unlock date" />
                            </div>
                            <label class="mt-2 flex shrink-0 items-center gap-1 text-xs text-zinc-500" title="Hidden until unlocked"><input type="checkbox" class="size-3.5 accent-amber-400" x-model="a.hidden" /> hidden</label>
                            <div class="flex shrink-0 gap-1 pt-1">
                              <button type="button" class="btn btn-sm" @click="move(form.achievements, i, i - 1)" :disabled="i === 0">&uarr;</button>
                              <button type="button" class="btn btn-sm" @click="move(form.achievements, i, i + 1)" :disabled="i === form.achievements.length - 1">&darr;</button>
                              <button type="button" class="btn btn-sm btn-danger" @click="removeAchievement(i)">&times;</button>
                            </div>
                          </li>
                        </template>
                      </ul>
                      <p x-show="!form.achievements.length" class="px-3 py-6 text-center text-sm text-zinc-500">No achievements yet. Add them one by one, paste a list below, or import the list from Steam with the app id above.</p>
                      <div class="flex flex-wrap items-start gap-2 border-t border-zinc-800 p-3">
                        <details class="text-xs text-zinc-500">
                          <summary class="cursor-pointer py-1 hover:text-zinc-300">Bulk add (one per line, optional "Title | Description")</summary>
                          <textarea class="input mt-2 min-h-24 w-96 font-mono" x-model="form.bulk" placeholder="First Blood | Win your first fight&#10;Collector"></textarea>
                          <button type="button" class="btn btn-sm mt-2" @click="addBulk()">Add lines</button>
                        </details>
                      </div>
                    </div>
                  </template>
                </div>
              </form>
            </template>
          </div>
        </section>
      </template>

      <!-- ===== RetroAchievements ===== -->
      <template x-if="$store.app.ready && $store.app.view === 'ra'">
        <section x-data="raView" class="space-y-6">
          <header>
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-amber-400/90">Integration</p>
            <h1 class="h-display text-4xl">RetroAchievements</h1>
          </header>

          <template x-if="status">
            <div class="space-y-6">
              <!-- config -->
              <div class="card p-4">
                <template x-if="!status.config.configured">
                  <div class="text-sm text-zinc-300">
                    <p class="font-semibold text-rose-300">Not configured.</p>
                    <ol class="mt-2 list-inside list-decimal space-y-1 text-zinc-400">
                      <li>Copy <code class="text-zinc-200">.env.example</code> to <code class="text-zinc-200">.env</code> in the project root.</li>
                      <li>Set <code class="text-zinc-200">RA_USERNAME</code> and <code class="text-zinc-200">RA_API_KEY</code> (retroachievements.org &rarr; Settings &rarr; Keys &rarr; Web API Key).</li>
                      <li>Restart <code class="text-zinc-200">npm run admin</code>. The key never leaves this machine; the site only ever sees the JSON snapshot.</li>
                    </ol>
                  </div>
                </template>
                <template x-if="status.config.configured">
                  <div class="flex flex-wrap items-center justify-between gap-4">
                    <div class="text-sm">
                      <p>Configured for <span class="font-semibold text-amber-300" x-text="status.config.username"></span>.</p>
                      <p class="text-zinc-500">
                        <span x-text="status.profile.syncedAt ? 'Last synced ' + $store.app.fmtDate(status.profile.syncedAt) : 'Never synced'"></span>
                        &middot; <span x-text="status.linkedGames"></span> library games linked to RA
                        <template x-if="status.profile.syncedAt"><span> &middot; <span x-text="status.profile.points.toLocaleString()"></span> points &middot; <span x-text="status.profile.completionCount"></span> games with progress</span></template>
                      </p>
                    </div>
                    <div class="flex flex-wrap items-center gap-3">
                      <label class="flex items-center gap-2 text-sm text-zinc-400" title="Set hours played from RA's tracked playtime. Only ever raises the number, never lowers a value you typed.">
                        <input type="checkbox" class="size-4 accent-amber-400" x-model="autoHours" /> Update hours played
                      </label>
                      <label class="flex items-center gap-2 text-sm text-zinc-400" title="Fill an empty Started with the date of your first unlock in the game, and an empty Finished with the date of your RA award (beaten / completed / mastered). Dates you typed are never changed.">
                        <input type="checkbox" class="size-4 accent-amber-400" x-model="autoDates" /> Fill in dates
                      </label>
                      <label class="flex items-center gap-2 text-sm text-zinc-400" title="Upgrade a game's status to Beaten/Completed/Mastered when RA awards say so. Never downgrades.">
                        <input type="checkbox" class="size-4 accent-amber-400" x-model="autoStatus" /> Auto-upgrade statuses
                      </label>
                      <button type="button" class="btn btn-accent" :disabled="job?.running" @click="sync()" x-text="job?.running ? 'Syncing...' : 'Sync now'"></button>
                    </div>
                  </div>
                </template>
              </div>

              <!-- job -->
              <template x-if="job && (job.running || job.finishedAt)">
                <div class="card p-4">
                  <div class="mb-2 flex items-center justify-between text-sm">
                    <span class="font-semibold" x-text="job.running ? 'Sync in progress' : (job.error ? 'Sync failed' : 'Last sync')"></span>
                    <span class="text-zinc-500" x-text="job.progress.total ? `${job.progress.done}/${job.progress.total} games` : ''"></span>
                  </div>
                  <div class="mb-3 h-2 overflow-hidden rounded-full bg-zinc-800">
                    <div class="h-full rounded-full transition-[width]" :class="job.error ? 'bg-rose-400' : 'bg-amber-400'" :style="`width:${job.running || job.progress.total ? progressPct : 100}%`"></div>
                  </div>
                  <pre x-ref="log" class="max-h-64 overflow-y-auto rounded-lg bg-zinc-950 p-3 text-xs leading-relaxed text-zinc-400"><template x-for="(line, i) in job.log" :key="i"><span class="block" :class="line.message.startsWith('ERROR') && 'text-rose-300'" x-text="line.message"></span></template></pre>
                </div>
              </template>

              <!-- subsets imported as separate games -->
              <div class="card border-amber-400/30 p-4" x-show="subsets.length" x-cloak>
                <h2 class="h-display text-xl">Subsets in the library</h2>
                <p class="mt-1 text-sm text-zinc-500">
                  RetroAchievements lists bonus / challenge sets ("[Subset - ...]") as separate games. These entries duplicate a game you already have;
                  merging keeps their achievements as a tab on that game's page and removes the extra library entry.
                </p>
                <ul class="mt-3 divide-y divide-zinc-800 overflow-hidden rounded-lg border border-zinc-800 bg-zinc-900">
                  <template x-for="s in subsets" :key="s.slug">
                    <li class="flex flex-wrap items-center gap-3 px-3 py-2 text-sm">
                      <span class="min-w-0 flex-1">
                        <span class="block truncate font-medium text-zinc-100" x-text="s.title"></span>
                        <span class="block text-xs text-zinc-500">
                          &rarr; <span class="text-zinc-300" x-text="s.parent.title"></span>
                          &middot; <span x-text="$store.app.status(s.status).label"></span>
                          <template x-if="s.hoursPlayed"><span>&middot; <span x-text="s.hoursPlayed"></span> h on the subset entry</span></template>
                        </span>
                      </span>
                      <button type="button" class="btn btn-sm btn-accent" :disabled="merging === s.slug" @click="mergeSubset(s)" x-text="merging === s.slug ? 'Merging...' : 'Merge into ' + s.parent.title"></button>
                    </li>
                  </template>
                </ul>
              </div>

              <!-- import -->
              <div class="card p-4" x-show="status.config.configured">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 class="h-display text-xl">Import games from your RA history</h2>
                    <p class="text-sm text-zinc-500">Adds library entries (with box art, developer, year and a suggested status) for games you have progress on but haven't added yet. Sync first.</p>
                  </div>
                  <div class="flex gap-2">
                    <button type="button" class="btn" :disabled="consolesBusy" @click="importConsoles()" title="Adds RA consoles to the platform list so imports can be matched" x-text="consolesBusy ? '...' : 'Import RA console list'"></button>
                    <button type="button" class="btn" :disabled="loadingCandidates || !status.profile.syncedAt" @click="loadCandidates()" x-text="loadingCandidates ? 'Loading...' : (candidates ? 'Reload' : 'Find games to import')"></button>
                  </div>
                </div>

                <template x-if="candidates">
                  <div class="mt-4">
                    <div class="mb-2 flex flex-wrap items-center gap-3 text-sm">
                      <span><span class="font-semibold" x-text="candidates.length"></span> not in the library yet</span>
                      <button type="button" class="text-amber-400 hover:underline" @click="selectAll(true)">Select all</button>
                      <button type="button" class="text-zinc-400 hover:underline" @click="selectAll(false)">Clear</button>
                      <button type="button" class="btn btn-sm btn-accent ml-auto" :disabled="importing || !selectedCount" @click="importSelected()" x-text="importing ? 'Importing...' : `Import ${selectedCount} selected`"></button>
                    </div>
                    <div class="max-h-[32rem] overflow-y-auto rounded-lg border border-zinc-800">
                      <table class="w-full text-sm">
                        <thead class="sticky top-0 bg-zinc-900 text-left text-xs uppercase tracking-wider text-zinc-500">
                          <tr><th class="p-2"></th><th class="p-2">Game</th><th class="p-2">Console &rarr; platform</th><th class="p-2">Progress</th><th class="p-2">Status</th></tr>
                        </thead>
                        <tbody class="divide-y divide-zinc-800">
                          <template x-for="c in candidates" :key="c.gameId">
                            <tr :class="selection[c.gameId] && 'bg-amber-400/5'">
                              <td class="p-2"><input type="checkbox" class="size-4 accent-amber-400" x-model="selection[c.gameId]" /></td>
                              <td class="p-2">
                                <div class="flex items-center gap-2">
                                  <img :src="c.imageIcon" alt="" class="size-8 rounded bg-zinc-800" loading="lazy" />
                                  <div class="min-w-0">
                                    <div class="truncate font-medium text-zinc-100" x-text="c.title"></div>
                                    <div class="text-xs text-zinc-500">#<span x-text="c.gameId"></span><span x-show="c.tag"> &middot; <span x-text="c.tag"></span></span></div>
                                  </div>
                                </div>
                              </td>
                              <td class="p-2">
                                <div class="text-xs text-zinc-500" x-text="c.consoleName"></div>
                                <select class="input mt-1 py-1" x-model="c.platform">
                                  <option value="">Auto (create if missing)</option>
                                  <template x-for="p in $store.app.meta.platforms" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
                                </select>
                              </td>
                              <td class="p-2 text-xs text-zinc-400">
                                <span x-text="`${c.numAwarded}/${c.maxPossible}`"></span>
                                <span x-show="c.highestAwardKind" class="chip ml-1 bg-emerald-500/15 text-emerald-300 ring-emerald-500/30" x-text="c.highestAwardKind"></span>
                              </td>
                              <td class="p-2">
                                <select class="input py-1" x-model="c.status">
                                  <template x-for="s in $store.app.meta.statuses" :key="s.id"><option :value="s.id" x-text="s.label"></option></template>
                                </select>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                      <p x-show="candidates.length === 0" class="p-6 text-center text-sm text-zinc-500">Everything from your RA history is already in the library.</p>
                    </div>
                    <template x-if="importResult">
                      <div class="mt-3 text-sm">
                        <p class="text-emerald-300" x-text="`Imported ${importResult.created.length} games. Run a sync to fetch their achievements.`"></p>
                        <ul class="mt-1 text-rose-300"><template x-for="e in importResult.errors" :key="e.gameId"><li x-text="`#${e.gameId}: ${e.message}`"></li></template></ul>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              <!-- trophy shelf order -->
              <div class="card p-4" x-show="status.profile.syncedAt" x-data="shelfEditor">
                <div class="flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <h2 class="h-display text-xl">Trophy shelf</h2>
                    <p class="text-sm text-zinc-500">
                      The badge wall on the Achievements page. By default it mirrors your RetroAchievements profile
                      (the order from "Reorder Site Awards" on RA). Drag rows, use the arrows, or hide badges to arrange it yourself.
                    </p>
                    <p class="mt-1 text-xs" :class="manual ? 'text-amber-300' : 'text-zinc-500'" x-text="manual ? 'Arranged by hand - saved in src/data/shelf.json.' : 'Following RetroAchievements order.'"></p>
                    <p class="mt-1 text-xs text-rose-300" x-show="!loading && !hasDisplayOrder" x-cloak>
                      This snapshot is from before profile order was recorded - run a sync to pick up your RA arrangement.
                    </p>
                  </div>
                  <div class="flex flex-wrap items-center gap-2">
                    <input type="search" class="input w-44" placeholder="Filter list..." x-model="filter" />
                    <button type="button" class="btn" :disabled="saving || !manual" @click="followRa()">Follow RA order</button>
                    <button type="button" class="btn btn-accent" :disabled="saving || !dirty" @click="save()" x-text="saving ? 'Saving...' : 'Save order'"></button>
                  </div>
                </div>

                <p class="mt-3 text-xs text-zinc-500">
                  <span x-text="visibleCount"></span> shown &middot; <span x-text="awards.length - visibleCount"></span> hidden
                  <span x-show="dirty" class="ml-2 text-amber-300">&bull; unsaved</span>
                </p>

                <ol class="mt-2 max-h-[36rem] divide-y divide-zinc-800/80 overflow-y-auto rounded-lg border border-zinc-800">
                  <template x-for="(a, i) in awards" :key="a.gameId">
                    <li
                      x-show="matches(a)"
                      class="flex items-center gap-3 px-3 py-2 text-sm transition"
                      :class="{ 'opacity-40': a.hidden, 'bg-amber-400/10': dragOver === i && dragFrom !== i }"
                      draggable="true"
                      @dragstart="onDragStart(i, $event)"
                      @dragover.prevent="dragOver = i"
                      @dragleave="dragOver === i && (dragOver = null)"
                      @drop.prevent="onDrop(i)"
                      @dragend="dragFrom = null; dragOver = null"
                    >
                      <span class="w-8 shrink-0 text-right font-mono text-xs text-zinc-600" x-text="i + 1"></span>
                      <span class="cursor-grab text-zinc-600 select-none" title="Drag to reorder">&#8942;&#8942;</span>
                      <img :src="a.imageIcon" alt="" class="size-10 shrink-0 rounded bg-zinc-800" loading="lazy" />
                      <span class="min-w-0 flex-1">
                        <span class="block truncate font-medium text-zinc-100" x-text="a.title"></span>
                        <span class="block truncate text-xs text-zinc-500"><span x-text="a.consoleName"></span> &middot; <span x-text="$store.app.fmtDate(a.awardedAt)"></span></span>
                      </span>
                      <span class="chip shrink-0" :class="$store.app.chip({ mastered: 'amber', completed: 'violet', 'beaten-hardcore': 'emerald', 'beaten-softcore': 'teal' }[a.kind] || 'zinc')" x-text="a.kind.replace('-', ' ')"></span>
                      <span class="flex shrink-0 gap-1">
                        <button type="button" class="btn btn-sm" title="Move to top" :disabled="i === 0" @click="move(i, 0)">&#8676;</button>
                        <button type="button" class="btn btn-sm" title="Move up" :disabled="i === 0" @click="move(i, i - 1)">&uarr;</button>
                        <button type="button" class="btn btn-sm" title="Move down" :disabled="i === awards.length - 1" @click="move(i, i + 1)">&darr;</button>
                        <button type="button" class="btn btn-sm" :class="a.hidden && 'btn-accent'" :title="a.hidden ? 'Show on the shelf' : 'Hide from the shelf'" @click="toggleHidden(i)" x-text="a.hidden ? 'Show' : 'Hide'"></button>
                      </span>
                    </li>
                  </template>
                </ol>
                <p x-show="!loading && awards.length === 0" class="p-4 text-center text-sm text-zinc-500">No game awards yet.</p>
              </div>

              <div class="card p-4 text-sm text-zinc-400">
                <h2 class="h-display mb-2 text-xl">What a sync does</h2>
                <ul class="list-inside list-disc space-y-1">
                  <li>Writes your profile, rank, points, recent unlocks, per-game completion and awards to <code class="text-zinc-300">src/data/ra-profile.json</code>.</li>
                  <li>For every library game with an RA game id, writes the full achievement list with your unlock dates to <code class="text-zinc-300">src/content/ra-games/&lt;id&gt;.json</code>.</li>
                  <li>Fills in missing cover art, developer, publisher, genre and release year on those games (never overwrites what you typed).</li>
                  <li>With "Update hours played" on, sets each linked game's hours from RA's tracked playtime (time spent while the emulator was connected to RA). It only raises the number, so hours you logged on real hardware are kept.</li>
                  <li>With "Auto-upgrade statuses" on, moves games to Beaten / Completed / Mastered based on your RA awards.</li>
                </ul>
              </div>
            </div>
          </template>
        </section>
      </template>

      <!-- ===== Settings ===== -->
      <template x-if="$store.app.ready && $store.app.view === 'settings'">
        <section x-data="settingsView" class="space-y-8">
          <header>
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-amber-400/90">Configuration</p>
            <h1 class="h-display text-4xl">Settings</h1>
          </header>

          <template x-if="site">
            <form class="card space-y-4 p-4" @submit.prevent="saveSite()">
              <div class="flex items-center justify-between">
                <h2 class="h-display text-xl">Site <span class="text-sm text-zinc-500">src/data/site.json</span></h2>
                <button type="submit" class="btn btn-accent" :disabled="savingSite" x-text="savingSite ? 'Saving...' : 'Save site'"></button>
              </div>
              <div class="grid gap-4 sm:grid-cols-2">
                <label class="field"><span class="label">Site title</span><input class="input" x-model="site.title" required /></label>
                <label class="field"><span class="label">Owner name</span><input class="input" x-model="site.owner" required /></label>
                <label class="field sm:col-span-2"><span class="label">Tagline</span><input class="input" x-model="site.tagline" /></label>
                <label class="field sm:col-span-2"><span class="label">About (markdown, shown on the home page)</span><textarea class="input min-h-24" x-model="site.about"></textarea></label>
                <label class="field"><span class="label">RetroAchievements username (for the footer link)</span><input class="input" x-model="site.raUsername" /></label>
                <label class="field"><span class="label">Google Search Console verification code</span><input class="input font-mono" x-model="site.googleSiteVerification" placeholder="content value of the meta tag Search Console gives you" /></label>
              </div>
              <div class="rounded-lg border border-zinc-800 bg-zinc-900/40 p-3">
                <span class="label mb-0">Removal requests</span>
                <p class="mb-3 text-xs leading-relaxed text-zinc-500">
                  Printed on <code class="text-zinc-400">/credits</code> and linked from every page's footer, so whoever made material
                  you reused can ask for it back. The address goes on a public page - use one you are happy to publish. Leave it empty
                  and requests fall back to a pre-filled issue on the repository below.
                </p>
                <div class="grid gap-3 sm:grid-cols-2">
                  <label class="field"><span class="label">Contact email</span><input class="input" type="email" x-model.trim="site.contact.email" placeholder="questlog@example.com" /></label>
                  <label class="field"><span class="label">Repository (fallback)</span><input class="input" x-model.trim="site.contact.repo" placeholder="https://github.com/user/repo" /></label>
                </div>
              </div>

              <div>
                <div class="mb-2 flex items-center justify-between">
                  <span class="label mb-0">Footer links</span>
                  <button type="button" class="btn btn-sm" @click="addLink()">+ Add link</button>
                </div>
                <div class="space-y-2">
                  <template x-for="(link, i) in site.links" :key="i">
                    <div class="flex gap-2">
                      <input class="input w-40" x-model="link.label" placeholder="Label" required />
                      <input class="input flex-1" x-model="link.url" placeholder="https://..." type="url" required />
                      <button type="button" class="btn btn-sm btn-danger" @click="site.links.splice(i, 1)">&times;</button>
                    </div>
                  </template>
                </div>
              </div>
            </form>
          </template>

          <template x-if="platforms">
            <form class="card space-y-4 p-4" @submit.prevent="savePlatforms()">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 class="h-display text-xl">Platforms <span class="text-sm text-zinc-500">src/data/platforms.json</span></h2>
                  <p class="text-xs text-zinc-500">The RA console id lets imports and lookups pick the right platform automatically. Platforms used by games can't be removed.</p>
                </div>
                <div class="flex gap-2">
                  <button type="button" class="btn btn-sm" @click="addPlatform()">+ Add platform</button>
                  <button type="submit" class="btn btn-accent" :disabled="savingPlatforms" x-text="savingPlatforms ? 'Saving...' : 'Save platforms'"></button>
                </div>
              </div>
              <table class="w-full text-sm">
                <thead class="text-left text-xs uppercase tracking-wider text-zinc-500">
                  <tr><th class="p-1">Id (slug)</th><th class="p-1">Name</th><th class="p-1">Short</th><th class="p-1">RA console id</th><th></th></tr>
                </thead>
                <tbody>
                  <template x-for="(p, i) in platforms" :key="i">
                    <tr>
                      <td class="p-1"><input class="input font-mono" x-model.trim="p.id" :readonly="existingIds.has(p.id) && p.id !== ''" @input="p._idTouched = true" pattern="[a-z0-9]+(-[a-z0-9]+)*" required /></td>
                      <td class="p-1"><input class="input" x-model="p.name" @input="onPlatformName(p)" required /></td>
                      <td class="p-1"><input class="input w-28" x-model.trim="p.short" required /></td>
                      <td class="p-1"><input class="input w-28" type="number" min="1" x-model="p.raConsoleId" /></td>
                      <td class="p-1"><button type="button" class="btn btn-sm btn-danger" @click="platforms.splice(i, 1)">&times;</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </form>
          </template>
        </section>
      </template>

      <!-- ===== Publish ===== -->
      <template x-if="$store.app.ready && $store.app.view === 'publish'">
        <section x-data="publishView" class="space-y-6">
          <header>
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-amber-400/90">Ship it</p>
            <h1 class="h-display text-4xl">Publish</h1>
            <p class="mt-1 text-sm text-zinc-500">Commits every change in the repo and pushes to GitHub. Vercel picks up the push and rebuilds the public site.</p>
          </header>

          <template x-if="error"><div class="card border-rose-500/40 p-4 text-sm text-rose-200" x-text="error"></div></template>

          <template x-if="git">
            <div class="space-y-6">
              <div class="card p-4">
                <div class="flex flex-wrap items-center justify-between gap-3 text-sm">
                  <div class="space-y-0.5">
                    <p>Branch <span class="font-mono text-amber-300" x-text="git.branch"></span> &rarr; <span class="font-mono text-zinc-300" x-text="git.remote || 'no remote'"></span></p>
                    <p class="text-zinc-500">
                      <span x-text="git.lastCommit ? 'Last commit: ' + git.lastCommit : 'No commits yet'"></span>
                      <span x-show="git.ahead"> &middot; <span x-text="git.ahead"></span> commit(s) not pushed</span>
                      <span x-show="git.behind" class="text-rose-300"> &middot; <span x-text="git.behind"></span> commit(s) behind remote - pull first</span>
                    </p>
                  </div>
                  <button type="button" class="btn btn-sm" @click="refresh()">Refresh</button>
                </div>
                <div class="mt-3">
                  <p class="label" x-text="git.clean ? 'Working tree is clean' : `${git.files.length} changed file(s)`"></p>
                  <ul class="max-h-64 overflow-y-auto rounded-lg bg-zinc-950 p-3 font-mono text-xs text-zinc-400" x-show="!git.clean">
                    <template x-for="f in git.files" :key="f.path">
                      <li><span class="inline-block w-8 text-amber-300" x-text="f.code"></span><span x-text="f.path"></span></li>
                    </template>
                  </ul>
                </div>
              </div>

              <div class="grid gap-6 lg:grid-cols-2">
                <div class="card p-4">
                  <h2 class="h-display text-xl">1. Test build</h2>
                  <p class="mb-3 text-sm text-zinc-500">Runs <code class="text-zinc-300">npm run build</code> locally. Catches schema errors (a bad date, a missing game reference) before Vercel does.</p>
                  <button type="button" class="btn" :disabled="building" @click="testBuild()" x-text="building ? 'Building...' : 'Run build'"></button>
                  <template x-if="buildResult">
                    <pre class="mt-3 max-h-72 overflow-auto rounded-lg bg-zinc-950 p-3 text-xs" :class="buildResult.ok ? 'text-emerald-200' : 'text-rose-200'" x-text="buildResult.output"></pre>
                  </template>
                </div>
                <div class="card p-4">
                  <h2 class="h-display text-xl">2. Commit &amp; push</h2>
                  <label class="field mt-3"><span class="label">Commit message</span><input class="input" x-model="message" /></label>
                  <button type="button" class="btn btn-accent mt-3" :disabled="publishing || git.clean" @click="publish()" x-text="publishing ? 'Pushing...' : 'Commit all & push'"></button>
                  <p class="mt-2 text-xs text-zinc-500">Prefer doing this by hand? <code class="text-zinc-300">git add -A && git commit -m "..." && git push</code> does exactly the same.</p>
                  <template x-if="publishResult">
                    <pre class="mt-3 max-h-72 overflow-auto rounded-lg bg-zinc-950 p-3 text-xs text-zinc-300" x-text="publishResult.output"></pre>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </section>
      </template>
    </main>
  </div>

  <!-- ===== Toasts ===== -->
  <div class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-80 flex-col gap-2">
    <template x-for="t in $store.app.toasts" :key="t.id">
      <div class="pointer-events-auto rounded-lg border px-3 py-2 text-sm shadow-lg" :class="t.type === 'error' ? 'border-rose-500/50 bg-rose-950/90 text-rose-100' : 'border-emerald-500/40 bg-emerald-950/90 text-emerald-100'" @click="$store.app.dismiss(t.id)" x-text="t.message"></div>
    </template>
  </div>
</body>
</html>
