<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>QuestLog Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/sweetalert2.js"></script>
  <script type="module">
    // window.dialog replaces confirm()/alert()/prompt(); the same helpers run on the public site.
    import { createDialogs } from '/vendor/dialogs.js';
    window.dialog = createDialogs(window.Swal);
  </script>
  <script src="/app.js"></script>
  <script defer src="/vendor/alpine.js"></script>
</head>
<body class="min-h-full font-sans text-zinc-100" x-data>
  <div class="flex min-h-screen">
    <!-- ===== Sidebar ===== -->
    <aside class="sticky top-0 flex h-screen w-60 shrink-0 flex-col border-r border-zinc-800 bg-zinc-950">
      <a href="#/dashboard" class="flex items-center gap-2.5 border-b border-zinc-800 px-4 py-4">
        <span class="grid size-9 place-items-center rounded-lg bg-amber-400 text-zinc-950">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-5"><path d="M7.5 5.5h9a5 5 0 014.9 6l-1 5a2.5 2.5 0 01-4.4 1.2L14 15h-4l-2 2.7a2.5 2.5 0 01-4.4-1.2l-1-5a5 5 0 014.9-6zM6.5 10h4M8.5 8v4M15.5 9h.01M17.5 11h.01"/></svg>
        </span>
        <span>
          <span class="block font-display text-xl leading-none text-zinc-50">QuestLog</span>
          <span class="block text-[10px] font-semibold uppercase tracking-[0.2em] text-amber-400/80">Local admin</span>
        </span>
      </a>

      <nav class="flex-1 space-y-0.5 overflow-y-auto p-3" aria-label="Admin">
        <template x-for="item in [
          { id: 'dashboard', label: 'Dashboard', icon: 'M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25' },
          { id: 'games', label: 'Games', icon: 'M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z' },
          { id: 'guides', label: 'Guides', icon: 'M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25' },
          { id: 'trackers', label: 'Trackers', icon: 'M11.35 3.836c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m8.9-4.414c.376.023.75.05 1.124.08 1.131.094 1.976 1.057 1.976 2.192V16.5A2.25 2.25 0 0118 18.75h-2.25m-7.5-10.5H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V18.75m-7.5-10.5h6.375c.621 0 1.125.504 1.125 1.125v9.375m-8.25-3l1.5 1.5 3-3.75' },
          { id: 'sets', label: 'Achievements', icon: 'M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z' },
          { id: 'ra', label: 'RetroAchievements', icon: 'M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 01-.982-3.172M9.497 14.25a7.454 7.454 0 00.981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 007.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 002.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 012.916.52 6.003 6.003 0 01-5.395 4.972m0 0a6.726 6.726 0 01-2.749 1.35m0 0a6.772 6.772 0 01-3.044 0' },
          { id: 'settings', label: 'Settings', icon: 'M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281zM15 12a3 3 0 11-6 0 3 3 0 016 0z' },
          { id: 'publish', label: 'Publish', icon: 'M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z' },
        ]" :key="item.id">
          <a :href="'#/' + item.id" class="nav-link group" :class="$store.app.view === item.id && 'nav-link-active'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4 shrink-0 transition" :class="$store.app.view === item.id ? 'text-amber-400' : 'text-zinc-500 group-hover:text-zinc-300'" aria-hidden="true"><path :d="item.icon" /></svg>
            <span x-text="item.label"></span>
          </a>
        </template>
      </nav>

      <div class="space-y-2 border-t border-zinc-800 p-4 text-xs text-zinc-500">
        <p>Listening on <span class="text-zinc-300">127.0.0.1</span> only. Nothing here is deployed.</p>
        <a :href="$store.app.siteUrl()" target="_blank" rel="noopener" class="block text-amber-400 hover:underline">Open dev site (npm run dev)</a>
      </div>
    </aside>

    <!-- ===== Main ===== -->
    <main class="min-w-0 flex-1 p-6 lg:p-8">
      <template x-if="$store.app.error">
        <div class="card border-rose-500/40 p-6 text-rose-200">
          <p class="font-semibold">The admin API is not reachable.</p>
          <p class="mt-1 text-sm" x-text="$store.app.error"></p>
        </div>
      </template>

      <!-- ===== Dashboard ===== -->
      <template x-if="$store.app.ready && $store.app.view === 'dashboard'">
        <section x-data="dashboardView">
          <header class="mb-6">
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-amber-400/90">Overview</p>
            <h1 class="h-display text-4xl">Dashboard</h1>
          </header>

          <template x-if="error"><p class="text-rose-300" x-text="error"></p></template>

          <template x-if="data">
            <div class="space-y-8">
              <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                <a href="#/games" class="card p-4 transition hover:border-zinc-600">
                  <div class="text-3xl font-bold tabular-nums text-zinc-50" x-text="data.games.owned"></div>
                  <div class="text-xs uppercase tracking-wider text-zinc-500">Games in library</div>
                  <div class="mt-1 text-xs text-zinc-500"><span x-text="data.games.wishlist"></span> wishlisted &middot; <span x-text="data.games.playing"></span> playing &middot; <span x-text="data.games.linked"></span> linked to RA</div>
                </a>
                <a href="#/guides" class="card p-4 transition hover:border-zinc-600">
                  <div class="text-3xl font-bold tabular-nums text-zinc-50" x-text="data.guides"></div>
                  <div class="text-xs uppercase tracking-wider text-zinc-500">Guides</div>
                  <div class="mt-1 text-xs text-zinc-500"><span x-text="data.trackers"></span> trackers</div>
                </a>
                <a href="#/ra" class="card p-4 transition hover:border-zinc-600">
                  <div class="text-3xl font-bold tabular-nums text-zinc-50" x-text="data.ra.syncedAt ? data.ra.points.toLocaleString() : '--'"></div>
                  <div class="text-xs uppercase tracking-wider text-zinc-500">RA points</div>
                  <div class="mt-1 text-xs text-zinc-500" x-text="data.ra.syncedAt ? 'Synced ' + $store.app.fmtDate(data.ra.syncedAt) : (data.ra.configured ? 'Never synced' : 'Not configured')"></div>
                </a>
                <a href="#/publish" class="card p-4 transition hover:border-zinc-600">
                  <div class="text-3xl font-bold tabular-nums text-zinc-50" x-text="data.git.error ? '!' : data.git.files.length"></div>
                  <div class="text-xs uppercase tracking-wider text-zinc-500">Unpublished changes</div>
                  <div class="mt-1 text-xs text-zinc-500" x-text="data.git.error ? data.git.error : (data.git.branch + (data.git.ahead ? ' · ' + data.git.ahead + ' commit(s) to push' : ''))"></div>
                </a>
              </div>

              <div class="grid gap-6 lg:grid-cols-2">
                <div class="card p-4">
                  <h2 class="h-display mb-3 text-xl">Library by status</h2>
                  <ul class="space-y-2">
                    <template x-for="s in $store.app.meta.statuses" :key="s.id">
                      <li class="flex items-center gap-3 text-sm">
                        <span class="chip w-24 justify-center" :class="$store.app.chip(s.color)" x-text="s.label"></span>
                        <div class="h-2 flex-1 overflow-hidden rounded-full bg-zinc-800">
                          <div class="h-full rounded-full bg-amber-400/80" :style="`width:${data.games.owned ? (data.games.byStatus[s.id] / data.games.owned) * 100 : 0}%`"></div>
                        </div>
                        <span class="w-8 text-right tabular-nums text-zinc-400" x-text="data.games.byStatus[s.id]"></span>
                      </li>
                    </template>
                  </ul>
                </div>

                <div class="card p-4">
                  <div class="mb-3 flex items-center justify-between">
                    <h2 class="h-display text-xl">Recently edited</h2>
                    <a href="#/games/new" class="btn btn-sm btn-accent">+ New game</a>
                  </div>
                  <ul class="divide-y divide-zinc-800">
                    <template x-for="g in data.recentGames" :key="g.slug">
                      <li>
                        <a :href="'#/games/' + g.slug" class="flex items-center gap-3 py-2 text-sm hover:text-amber-300">
                          <span class="chip" :class="$store.app.chip($store.app.status(g.status).color)" x-text="$store.app.status(g.status).short"></span>
                          <span class="flex-1 truncate" x-text="g.title"></span>
                          <span class="text-xs text-zinc-500" x-text="$store.app.platform(g.platform).short"></span>
                        </a>
                      </li>
                    </template>
                  </ul>
                </div>
              </div>

              <div class="card p-4 text-sm text-zinc-400">
                <h2 class="h-display mb-2 text-xl">Workflow</h2>
                <ol class="list-inside list-decimal space-y-1">
                  <li>Edit games, guides and trackers here. Every change is written straight into <code class="text-zinc-300">src/content</code>.</li>
                  <li>Optionally sync RetroAchievements to refresh <code class="text-zinc-300">src/data/ra-profile.json</code> and per-game snapshots.</li>
                  <li>Check the result on the dev site (<code class="text-zinc-300">npm run dev</code>), then go to <a href="#/publish" class="text-amber-400 hover:underline">Publish</a> to commit and push. Vercel rebuilds automatically.</li>
                </ol>
              </div>
            </div>
          </template>
        </section>
      </template>

      <!-- ===== Games ===== -->
      <template x-if="$store.app.ready && $store.app.view === 'games'">
        <section x-data="gamesView" class="grid gap-6" :class="!($store.app.listHidden && form) && 'xl:grid-cols-[340px_1fr]'">
          <!-- list -->
          <div class="card flex max-h-[calc(100vh-4rem)] flex-col" x-show="!($store.app.listHidden && form)">
            <div class="flex items-center justify-between border-b border-zinc-800 px-3 py-3">
              <h1 class="h-display text-2xl">Games <span class="font-sans text-base text-zinc-500" x-text="`(${games.length})`"></span></h1>
              <button type="button" class="btn btn-sm btn-accent" @click="create()">+ New</button>
            </div>
            <div class="space-y-2 border-b border-zinc-800 p-3">
              <input type="search" class="input" placeholder="Search..." x-model="q" />
              <div class="grid grid-cols-3 gap-2">
                <select class="input" x-model="filterOwnership">
                  <option value="">Owned + wish</option>
                  <template x-for="o in $store.app.meta.ownership" :key="o.id"><option :value="o.id" x-text="o.label"></option></template>
                </select>
                <select class="input" x-model="filterStatus">
                  <option value="">Any status</option>
                  <template x-for="s in $store.app.meta.statuses" :key="s.id"><option :value="s.id" x-text="s.label"></option></template>
                </select>
                <select class="input" x-model="filterPlatform">
                  <option value="">Any platform</option>
                  <template x-for="p in $store.app.meta.platforms" :key="p.id"><option :value="p.id" x-text="p.short"></option></template>
                </select>
              </div>
            </div>
            <ul class="flex-1 overflow-y-auto">
              <template x-for="g in filtered" :key="g.slug">
                <li>
                  <button type="button" class="row" :class="selected === g.slug && 'row-active'" @click="open(g.slug)">
                    <span class="block h-12 w-9 shrink-0 overflow-hidden rounded bg-zinc-800">
                      <img x-show="g.cover" :src="g.cover" alt="" class="h-full w-full object-cover" loading="lazy" />
                    </span>
                    <span class="min-w-0 flex-1">
                      <span class="block truncate font-medium text-zinc-100" x-text="g.title"></span>
                      <span class="block text-xs text-zinc-500">
                        <span x-text="$store.app.platform(g.platform).short"></span>
                        <span x-show="g.ownership === 'wishlist'"> &middot; wishlist</span>
                        <span x-show="g.favorite" class="text-rose-400"> &hearts;</span>
                      </span>
                    </span>
                    <span class="chip shrink-0" :class="$store.app.chip($store.app.status(g.status).color)" x-text="$store.app.status(g.status).short"></span>
                  </button>
                </li>
              </template>
              <li x-show="filtered.length === 0" class="p-6 text-center text-sm text-zinc-500">No games match.</li>
            </ul>
          </div>

          <!-- editor -->
          <div>
            <template x-if="!form">
              <div class="card flex h-64 flex-col items-center justify-center gap-2 text-center text-zinc-500">
                <p class="font-display text-2xl text-zinc-300">Pick a game or create one</p>
                <p class="text-sm">Each game is a JSON file in <code>src/content/games/</code>.</p>
                <button type="button" class="btn btn-accent mt-2" @click="create()">+ New game</button>
              </div>
            </template>

            <template x-if="form">
              <form class="space-y-6" @submit.prevent="save()">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 class="text-2xl font-bold tracking-tight text-zinc-50" x-text="isNew ? 'New game' : form.title"></h2>
                    <p class="text-xs text-zinc-500">
                      <span x-text="isNew ? 'Will be saved as' : 'File:'"></span>
                      <code class="text-zinc-300" x-text="`src/content/games/${isNew ? slugPreview : selected}.json`"></code>
                      <span x-show="dirty" class="ml-2 text-amber-300">&bull; unsaved</span>
                    </p>
                  </div>
                  <div class="flex items-center gap-2">
                    <button type="button" class="btn btn-sm" @click="$store.app.toggleList()" :aria-pressed="$store.app.listHidden" :title="$store.app.listHidden ? 'Show the list again' : 'Hide the list for a wider editor'">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5 text-amber-400"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
                      <span x-text="$store.app.listHidden ? 'Show list' : 'Hide list'"></span>
                    </button>
                    <a x-show="!isNew" :href="$store.app.siteUrl('/games/' + selected)" target="_blank" rel="noopener" class="btn btn-sm">View on dev site</a>
                    <button type="button" class="btn btn-sm" @click="close()">Close</button>
                    <button type="button" x-show="!isNew" class="btn btn-sm btn-danger" @click="remove()">Delete</button>
                    <button type="submit" class="btn btn-accent" :disabled="saving" x-text="saving ? 'Saving...' : 'Save'"></button>
                  </div>
                </div>

                <div class="grid gap-6 lg:grid-cols-[220px_1fr]">
                  <!-- cover column -->
                  <div class="space-y-3">
                    <div class="card aspect-[3/4] overflow-hidden bg-zinc-900">
                      <img x-show="form.cover" :src="form.cover" alt="" class="h-full w-full object-cover" />
                      <div x-show="!form.cover" class="flex h-full items-center justify-center text-xs text-zinc-600">No cover</div>
                    </div>
                    <label class="field">
                      <span class="label">Cover URL or /covers/ path</span>
                      <input class="input" x-model.trim="form.cover" placeholder="https://... or /covers/slug.png" />
                    </label>
                    <div class="flex flex-wrap gap-2">
                      <label class="btn btn-sm cursor-pointer" :class="isNew && 'opacity-50'" :title="isNew ? 'Save the game first' : 'Upload an image into public/covers'">
                        <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" :disabled="isNew || covers.uploading" @change="uploadCover($event)" />
                        <span x-text="covers.uploading ? 'Working...' : 'Upload file'"></span>
                      </label>
                      <button type="button" class="btn btn-sm" :disabled="isNew || !form.cover || form.cover.startsWith('/covers/') || covers.uploading" @click="localizeCover()" title="Download the remote image into public/covers so the site never depends on another host">Save URL locally</button>
                    </div>
                  </div>

                  <!-- fields -->
                  <div class="space-y-6">
                    <fieldset class="card space-y-4 p-4">
                      <legend class="px-1 text-xs font-semibold uppercase tracking-wider text-amber-400/90">Basics</legend>
                      <div class="grid gap-4 sm:grid-cols-2">
                        <label class="field sm:col-span-2">
                          <span class="label">Title *</span>
                          <input class="input" x-model="form.title" required />
                        </label>
                        <label class="field" x-show="isNew">
                          <span class="label">Slug (optional)</span>
                          <input class="input font-mono" x-model.trim="form.slug" :placeholder="slugPreview || 'auto from title'" pattern="[a-z0-9]+(-[a-z0-9]+)*" />
                        </label>
                        <label class="field">
                          <span class="label">Platform *</span>
                          <select class="input" x-model="form.platform" required>
                            <option value="">Select...</option>
                            <template x-for="p in $store.app.meta.platforms" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
                          </select>
                        </label>
                        <div class="field">
                          <span class="label">RetroAchievements game id</span>
                          <div class="flex gap-2">
                            <input class="input" type="number" min="1" x-model="form.raGameId" placeholder="e.g. 1" />
                            <button type="button" class="btn shrink-0" :disabled="busy || !$store.app.meta.ra.configured || !form.raGameId" @click="lookupRa()" :title="$store.app.meta.ra.configured ? 'Fill empty fields from RA' : 'Configure RA in .env first'" x-text="busy ? '...' : 'Fetch'"></button>
                          </div>
                          <p class="mt-1 text-[11px] text-zinc-500">The number in retroachievements.org/game/<b>1234</b>. Linking enables achievement sync and pre-fills metadata.</p>
                        </div>
                        <div class="field">
                          <span class="label">Steam app id</span>
                          <div class="flex gap-2">
                            <input class="input" type="number" min="1" x-model="form.steamAppId" placeholder="e.g. 105600" />
                            <button type="button" class="btn shrink-0" :disabled="busy || !form.steamAppId" @click="lookupSteam()" title="Fill empty fields from the Steam store (no key needed)" x-text="busy ? '...' : 'Fetch'"></button>
                          </div>
                          <p class="mt-1 text-[11px] text-zinc-500">The number in store.steampowered.com/app/<b>105600</b>. Linking enables the Steam achievement sync (Achievements tab).</p>
                        </div>
                      </div>
                    </fieldset>

                    <!-- Per-subset journal: shown when RA subsets are attached to this game (after a sync or a merge) -->
                    <fieldset class="card space-y-3 p-4" x-show="raSubsets.length" x-cloak>
                      <legend class="px-1 text-xs font-semibold uppercase tracking-wider text-amber-400/90">Subsets</legend>
                      <p class="text-xs text-zinc-500">
                        RetroAchievements subsets of this game. Their achievements come from the sync; your own rating, hours and dates for each
                        one live here and switch in on the game page together with the subset's achievement tab.
                      </p>
                      <div class="space-y-2">
                        <template x-for="sub in raSubsets" :key="sub.raGameId">
                          <div class="rounded-lg border border-zinc-800 bg-zinc-900 p-3">
                            <div class="mb-2 flex flex-wrap items-center gap-2 text-sm">
                              <span class="font-medium text-zinc-100" x-text="sub.label"></span>
                              <span class="text-xs text-zinc-500" x-text="`${sub.numAwarded}/${sub.numAchievements} unlocked` + (sub.playtimeHours ? ` · ${sub.playtimeHours} h tracked by RA` : '')"></span>
                              <a :href="`https://retroachievements.org/game/${sub.raGameId}`" target="_blank" rel="noopener" class="text-xs text-amber-400 hover:underline">RA #<span x-text="sub.raGameId"></span></a>
                            </div>
                            <template x-if="subsetRow(sub.raGameId)">
                              <div class="grid gap-3 sm:grid-cols-4">
                                <label class="field"><span class="label">Rating (0-10)</span><input class="input" type="number" min="0" max="10" step="0.5" x-model="subsetRow(sub.raGameId).rating" /></label>
                                <label class="field"><span class="label">Hours played</span><input class="input" type="number" min="0" step="0.1" x-model="subsetRow(sub.raGameId).hoursPlayed" :placeholder="sub.playtimeHours ? String(sub.playtimeHours) : ''" /></label>
                                <label class="field"><span class="label">Started</span><input class="input" type="date" x-model="subsetRow(sub.raGameId).startedAt" /></label>
                                <label class="field"><span class="label">Finished</span><input class="input" type="date" x-model="subsetRow(sub.raGameId).finishedAt" /></label>
                                <label class="field sm:col-span-2"><span class="label">Review (markdown)</span><textarea class="input min-h-20" x-model="subsetRow(sub.raGameId).review" placeholder="What did you think of this set?"></textarea></label>
                                <label class="field sm:col-span-2"><span class="label">Notes (markdown)</span><textarea class="input min-h-20" x-model="subsetRow(sub.raGameId).notes" placeholder="Where you left off, what is missing..."></textarea></label>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </fieldset>

                    <fieldset class="card space-y-4 p-4">
                      <legend class="px-1 text-xs font-semibold uppercase tracking-wider text-amber-400/90">Details</legend>
                      <div class="grid gap-4 sm:grid-cols-2">
                        <label class="field"><span class="label">Developer</span><input class="input" x-model.trim="form.developer" /></label>
                        <label class="field"><span class="label">Publisher</span><input class="input" x-model.trim="form.publisher" /></label>
                        <label class="field"><span class="label">Release year</span><input class="input" type="number" min="1950" max="2100" x-model="form.releaseYear" /></label>
                        <label class="field"><span class="label">Genres (comma separated)</span><input class="input" x-model="form.genres" placeholder="RPG, Action" /></label>
                        <label class="field sm:col-span-2"><span class="label">Tags (comma separated)</span><input class="input" x-model="form.tags" placeholder="classic, backlog-priority" /></label>
                      </div>
                    </fieldset>

                    <fieldset class="card space-y-4 p-4">
                      <legend class="px-1 text-xs font-semibold uppercase tracking-wider text-amber-400/90">Progress</legend>
                      <div class="grid gap-4 sm:grid-cols-3">
                        <label class="field">
                          <span class="label">Ownership</span>
                          <select class="input" x-model="form.ownership">
                            <template x-for="o in $store.app.meta.ownership" :key="o.id"><option :value="o.id" x-text="o.label"></option></template>
                          </select>
                        </label>
                        <label class="field">
                          <span class="label">Status</span>
                          <select class="input" x-model="form.status">
                            <template x-for="s in $store.app.meta.statuses" :key="s.id"><option :value="s.id" x-text="s.label"></option></template>
                          </select>
                        </label>
                        <label class="flex items-center gap-2 self-end pb-2 text-sm">
                          <input type="checkbox" class="size-4 accent-amber-400" x-model="form.favorite" /> Favorite
                        </label>
                        <label class="field"><span class="label">Rating (0-10)</span><input class="input" type="number" min="0" max="10" step="0.5" x-model="form.rating" /></label>
                        <label class="field"><span class="label">Hours played</span><input class="input" type="number" min="0" step="0.5" x-model="form.hoursPlayed" /></label>
                        <div></div>
                        <label class="field"><span class="label">Started</span><input class="input" type="date" x-model="form.startedAt" /></label>
                        <label class="field"><span class="label">Finished</span><input class="input" type="date" x-model="form.finishedAt" /></label>
                      </div>
                      <p class="text-[11px] text-zinc-500" x-text="$store.app.status(form.status).description"></p>
                    </fieldset>

                    <fieldset class="card space-y-4 p-4">
                      <legend class="px-1 text-xs font-semibold uppercase tracking-wider text-amber-400/90">Writing (markdown)</legend>
                      <label class="field"><span class="label">Review</span><textarea class="input min-h-28" x-model="form.review" placeholder="What did you think?"></textarea></label>
                      <label class="field"><span class="label">Notes</span><textarea class="input min-h-20" x-model="form.notes" placeholder="Where you left off, what to do next..."></textarea></label>
                    </fieldset>
                  </div>
                </div>
              </form>
            </template>
          </div>
        </section>
      </template>

      <!-- ===== Guides ===== -->
      <template x-if="$store.app.ready && $store.app.view === 'guides'">
        <section x-data="guidesView" class="grid gap-6" :class="!($store.app.listHidden && form) && 'xl:grid-cols-[320px_1fr]'">
          <div class="card flex max-h-[calc(100vh-4rem)] flex-col" x-show="!($store.app.listHidden && form)">
            <div class="flex items-center justify-between border-b border-zinc-800 px-3 py-3">
              <h1 class="h-display text-2xl">Guides <span class="font-sans text-base text-zinc-500" x-text="`(${guides.length})`"></span></h1>
              <button type="button" class="btn btn-sm btn-accent" @click="create()">+ New</button>
            </div>
            <div class="border-b border-zinc-800 p-3"><input type="search" class="input" placeholder="Search..." x-model="q" /></div>
            <ul class="flex-1 overflow-y-auto">
              <template x-for="g in filtered" :key="g.slug">
                <li>
                  <button type="button" class="row" :class="selected === g.slug && 'row-active'" @click="open(g.slug)">
                    <span class="min-w-0 flex-1">
                      <span class="block truncate font-medium text-zinc-100" x-text="g.title"></span>
                      <span class="block truncate text-xs text-zinc-500"><span x-text="g.game || 'no game'"></span> &middot; <span x-text="$store.app.fmtDate(g.updatedAt)"></span></span>
                    </span>
                    <span class="chip shrink-0 bg-zinc-800 text-zinc-300 ring-zinc-700" x-text="g.type"></span>
                    <span x-show="g.draft" class="chip bg-zinc-800 text-zinc-400 ring-zinc-700">draft</span>
                  </button>
                </li>
              </template>
              <li x-show="filtered.length === 0" class="p-6 text-center text-sm text-zinc-500">No guides yet.</li>
            </ul>
          </div>

          <div>
            <template x-if="!form">
              <div class="card flex h-64 flex-col items-center justify-center gap-2 text-center text-zinc-500">
                <p class="font-display text-2xl text-zinc-300">Pick a guide or write one</p>
                <p class="text-sm">Guides are markdown files in <code>src/content/guides/</code>. Walkthroughs, maps, item lists, cheats, reviews, notes - any type you like, grouped per game on the site.</p>
                <button type="button" class="btn btn-accent mt-2" @click="create()">+ New guide</button>
              </div>
            </template>

            <template x-if="form">
              <form class="space-y-4" @submit.prevent="save()">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 class="text-2xl font-bold tracking-tight text-zinc-50" x-text="isNew ? 'New guide' : form.title"></h2>
                    <p class="text-xs text-zinc-500">
                      <code class="text-zinc-300" x-text="`src/content/guides/${isNew ? slugPreview : selected}.md`"></code>
                      <span x-show="dirty" class="ml-2 text-amber-300">&bull; unsaved</span>
                    </p>
                  </div>
                  <div class="flex items-center gap-2">
                    <button type="button" class="btn btn-sm" @click="$store.app.toggleList()" :aria-pressed="$store.app.listHidden" :title="$store.app.listHidden ? 'Show the list again' : 'Hide the list for a wider editor'">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5 text-amber-400"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
                      <span x-text="$store.app.listHidden ? 'Show list' : 'Hide list'"></span>
                    </button>
                    <a x-show="!isNew" :href="$store.app.siteUrl('/guides/' + selected)" target="_blank" rel="noopener" class="btn btn-sm">View on dev site</a>
                    <button type="button" class="btn btn-sm" @click="close()">Close</button>
                    <button type="button" x-show="!isNew" class="btn btn-sm btn-danger" @click="remove()">Delete</button>
                    <button type="submit" class="btn btn-accent" :disabled="saving" x-text="saving ? 'Saving...' : 'Save'"></button>
                  </div>
                </div>

                <div class="card grid gap-4 p-4 sm:grid-cols-2 lg:grid-cols-6">
                  <label class="field sm:col-span-2 lg:col-span-3"><span class="label">Title *</span><input class="input" x-model="form.title" required /></label>
                  <label class="field lg:col-span-2" x-show="isNew"><span class="label">Slug (optional)</span><input class="input font-mono" x-model.trim="form.slug" :placeholder="slugPreview || 'auto'" /></label>
                  <label class="field lg:col-span-2">
                    <span class="label">Type</span>
                    <input class="input" x-model.trim="form.type" list="guide-type-suggestions" placeholder="Walkthrough, Maps, Items, Persona List..." />
                    <datalist id="guide-type-suggestions">
                      <template x-for="t in typeSuggestions" :key="t"><option :value="t"></option></template>
                    </datalist>
                  </label>
                  <label class="field lg:col-span-2">
                    <span class="label">Game</span>
                    <select class="input" x-model="form.game">
                      <option value="">Not tied to a game</option>
                      <template x-for="g in games" :key="g.slug"><option :value="g.slug" x-text="`${g.title} (${$store.app.platform(g.platform).short})`"></option></template>
                    </select>
                  </label>
                  <label class="field"><span class="label">Version</span><input class="input" x-model.trim="form.version" placeholder="1.0" /></label>
                  <label class="field"><span class="label">Order in group</span><input class="input" type="number" x-model="form.order" title="Lower comes first inside its type (e.g. Part 1 = 1, Part 2 = 2)" /></label>
                  <label class="field lg:col-span-2">
                    <span class="label">Series</span>
                    <input class="input" x-model.trim="form.series" list="guide-series-suggestions" placeholder="Main walkthrough" title="Guides of this game with the same series name get previous / next links, in Order. Leave empty for a standalone guide." />
                    <datalist id="guide-series-suggestions">
                      <template x-for="s in seriesSuggestions" :key="s"><option :value="s"></option></template>
                    </datalist>
                  </label>
                  <label class="field lg:col-span-2"><span class="label">Tags</span><input class="input" x-model="form.tags" placeholder="comma, separated" /></label>
                  <div class="text-xs text-zinc-500 sm:col-span-2 lg:col-span-6" x-show="seriesParts.length > 1" x-cloak>
                    <span class="text-zinc-400">Reading order:</span>
                    <template x-for="(part, i) in seriesParts" :key="part.slug">
                      <span><span x-show="i > 0" class="text-zinc-700"> &rarr; </span><span :class="part.current ? 'font-semibold text-amber-300' : ''" x-text="part.title"></span></span>
                    </template>
                    <span class="text-zinc-600">&middot; set by Order</span>
                  </div>
                  <label class="flex items-center gap-2 self-end pb-2 text-sm lg:col-span-1"><input type="checkbox" class="size-4 accent-amber-400" x-model="form.draft" /> Draft</label>
                  <label class="field lg:col-span-2">
                    <span class="label">Checklist layout</span>
                    <select class="input" x-model.number="form.checklistColumns" title="How - [ ] task lists are laid out on the site (readers can change it)">
                      <option :value="1">Single column</option>
                      <option :value="2">2 columns</option>
                      <option :value="3">3 columns</option>
                    </select>
                  </label>
                  <label class="flex items-center gap-2 self-end pb-2 text-sm lg:col-span-2"><input type="checkbox" class="size-4 accent-amber-400" x-model="form.checklistCollapsed" /> Collapse checklists by default</label>
                  <label class="field sm:col-span-2 lg:col-span-6"><span class="label">Summary</span><input class="input" x-model="form.summary" placeholder="One sentence shown in lists" /></label>
                </div>

                <div class="card">
                  <!-- Toolbar: compact icon buttons, hover for the tooltip. -->
                  <div class="flex flex-wrap items-center gap-1 border-b border-zinc-800 px-3 py-2 text-xs">
                    <span class="mr-1 font-semibold uppercase tracking-wider text-zinc-500">Body</span>
                    <button type="button" class="tool" @click="prefixLines('## ')" title="Heading 2 (section) - toggles on the current line(s)">H2</button>
                    <button type="button" class="tool" @click="prefixLines('### ')" title="Heading 3 (sub-section) - toggles on the current line(s)">H3</button>
                    <button type="button" class="tool" @click="prefixLines('> ')" title="Quote - toggles on the current line(s)">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M10 11H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v6c0 2.667-1.333 4.333-4 5M19 11h-4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v6c0 2.667-1.333 4.333-4 5" /></svg>
                    </button>
                    <button type="button" class="tool" :class="panel === 'table' && 'tool-active'" @click="togglePanel('table')" title="Insert a table (pick the size)">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5zM3 10h18M10 3v18" /></svg>
                    </button>
                    <span class="mx-1 h-4 w-px bg-zinc-800"></span>
                    <button type="button" class="tool font-bold" @click="wrap('**')" title="Bold">B</button>
                    <button type="button" class="tool italic" @click="wrap('*')" title="Italic">I</button>
                    <button type="button" class="tool underline" @click="wrap('<u>', '</u>')" title="Underline">U</button>
                    <button type="button" class="tool line-through" @click="wrap('~~')" title="Strikethrough">S</button>
                    <span class="mx-1 h-4 w-px bg-zinc-800"></span>
                    <button type="button" class="tool" @click="prefixLines('- [ ] ')" title="Checklist item - toggles on the current line(s)">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M9 11l3 3 8-8M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9" /></svg>
                    </button>
                    <button type="button" class="tool" @click="setTasks(true)" title="Tick all: every - [ ] in the selected lines, or the whole checklist at the cursor">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 text-emerald-300"><path d="M7 12l5 5L22 7M2 12l5 5m5-5l5-5" /></svg>
                    </button>
                    <button type="button" class="tool" @click="setTasks(false)" title="Untick all: every - [x] in the selected lines, or the whole checklist at the cursor">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5z" /></svg>
                    </button>
                    <span class="mx-1 h-4 w-px bg-zinc-800"></span>
                    <button type="button" class="tool" :class="panel === 'outline' && 'tool-active'" @click="togglePanel('outline')" title="Outline: every heading of the guide - click one to jump there">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M9 6h11M9 12h11M9 18h11M5 6v.01M5 12v.01M5 18v.01" /></svg>
                      <span x-show="outline.length" x-text="outline.length"></span>
                    </button>
                    <button type="button" class="tool" :class="panel === 'images' && 'tool-active'" @click="togglePanel('images')" :disabled="isNew" :title="isNew ? 'Save the guide first' : 'Gallery: upload images, insert them, arrange the gallery'">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25z" /></svg>
                      Gallery
                    </button>
                    <button type="button" class="tool" :class="panel === 'link' && 'tool-active'" @click="togglePanel('link')" title="Insert a link: one of your guides (or a section of it), or any other address">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" /></svg>
                      Link
                    </button>
                    <button type="button" class="tool" :class="panel === 'downloads' && 'tool-active'" @click="togglePanel('downloads')" title="Downloads: files linked from the sidebar (e.g. a zip on a GitHub release)">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
                      <span x-show="form.downloads.length" x-text="form.downloads.length"></span>
                    </button>
                    <button type="button" class="tool" :class="panel === 'sources' && 'tool-active'" @click="togglePanel('sources')" title="Sources: credit material taken from elsewhere - shown at the end of the guide with a removal link, and listed on /credits">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" /></svg>
                      <span x-show="form.sources.length" x-text="form.sources.length"></span>
                    </button>
                    <button type="button" class="tool" @click="insertTemplate()" title="Template: insert the walkthrough skeleton (intro, controls, characters, areas with map + checklist, credits)">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>
                      Template
                    </button>
                    <span class="ml-auto flex items-center gap-2">
                      <span class="text-zinc-500" x-text="`${(form.body || '').length} chars`"></span>
                      <button type="button" class="tool" :class="preview && 'tool-active'" @click="preview = !preview" :title="preview ? 'Back to editing' : 'Preview the rendered guide'">
                        <svg x-show="!preview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                        <svg x-show="preview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z" /></svg>
                        <span x-text="preview ? 'Edit' : 'Preview'"></span>
                      </button>
                    </span>
                  </div>

                  <!-- Backdrop shared by the outline drawer and the dialogs -->
                  <div x-show="panel" x-cloak x-transition.opacity.duration.150ms class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm" @click="panel = null" aria-hidden="true"></div>

                  <!-- Outline drawer: jump to any heading of the body -->
                  <aside
                    x-show="panel === 'outline'"
                    x-cloak
                    x-transition:enter="transition duration-200 ease-out"
                    x-transition:enter-start="translate-x-full"
                    x-transition:enter-end="translate-x-0"
                    x-transition:leave="transition duration-150 ease-in"
                    x-transition:leave-start="translate-x-0"
                    x-transition:leave-end="translate-x-full"
                    class="fixed inset-y-0 right-0 z-50 flex w-[88vw] max-w-sm flex-col border-l border-zinc-800 bg-zinc-950 shadow-2xl"
                    aria-label="Outline"
                  >
                    <div class="flex items-center justify-between border-b border-zinc-800 px-4 py-3">
                      <p class="font-display text-xl text-zinc-100">Outline <span class="font-sans text-sm text-zinc-500" x-show="outline.length" x-text="outline.length"></span></p>
                      <button type="button" class="btn btn-sm" @click="panel = null" aria-label="Close">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M6 18L18 6M6 6l12 12" /></svg>
                      </button>
                    </div>
                    <ol class="min-h-0 flex-1 space-y-0.5 overflow-y-auto p-3 text-sm" x-show="outline.length">
                      <template x-for="h in outline" :key="h.line">
                        <li>
                          <button
                            type="button"
                            class="flex w-full items-baseline gap-2 rounded-md px-2 py-1.5 text-left transition hover:bg-zinc-900 hover:text-amber-300"
                            :class="h.depth === 3 ? 'pl-6 text-zinc-400' : 'text-zinc-200'"
                            @click="jumpToLine(h.line); panel = null"
                            :title="`Line ${h.line + 1}`"
                          >
                            <span class="min-w-0 flex-1 truncate" x-text="h.text"></span>
                            <span class="shrink-0 font-mono text-[10px] text-zinc-600" x-text="`L${h.line + 1}`"></span>
                          </button>
                        </li>
                      </template>
                    </ol>
                    <p class="p-4 text-sm text-zinc-500" x-show="!outline.length">No headings yet. Add sections with H2 / H3 or the Template.</p>
                  </aside>

                  <!-- Table dialog: pick the starting size -->
                  <div x-show="panel === 'table'" x-cloak class="fixed inset-0 z-50 grid place-items-center p-4" @click.self="panel = null" role="dialog" aria-modal="true" aria-label="Insert a table">
                    <form class="card w-full max-w-sm overflow-hidden bg-zinc-950 shadow-2xl" @submit.prevent="insertTable()">
                      <div class="flex items-center justify-between border-b border-zinc-800 px-4 py-3">
                        <p class="font-display text-xl text-zinc-100">Insert a table</p>
                        <button type="button" class="btn btn-sm" @click="panel = null" aria-label="Close">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                      </div>
                      <div class="space-y-4 p-4">
                        <div class="grid grid-cols-2 gap-3">
                          <label class="field"><span class="label">Columns</span><input class="input" type="number" min="1" max="12" x-model.number="table.cols" /></label>
                          <label class="field"><span class="label">Rows</span><input class="input" type="number" min="1" max="50" x-model.number="table.rows" title="Body rows, not counting the header" /></label>
                        </div>
                        <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="size-4 accent-amber-400" x-model="table.header" /> Fill the header row with placeholder labels</label>
                        <!-- Size preview: one box per cell, header row in amber -->
                        <div class="overflow-hidden rounded-lg border border-zinc-800 bg-zinc-900/60 p-3">
                          <div class="grid gap-1" :style="`grid-template-columns: repeat(${Math.min(12, Math.max(1, table.cols || 1))}, minmax(0, 1fr))`">
                            <template x-for="i in Math.min(12, Math.max(1, table.cols || 1)) * (1 + Math.min(8, Math.max(1, table.rows || 1)))" :key="i">
                              <span class="h-3 rounded-sm" :class="i <= Math.min(12, Math.max(1, table.cols || 1)) ? 'bg-amber-400/70' : 'bg-zinc-700'"></span>
                            </template>
                          </div>
                          <p class="mt-2 text-xs text-zinc-500" x-text="`${Math.min(12, Math.max(1, table.cols || 1))} columns x ${Math.min(50, Math.max(1, table.rows || 1))} rows` + (table.rows > 8 ? ' (preview shows the first 8)' : '')"></p>
                        </div>
                        <details class="rounded-lg border border-zinc-800 bg-zinc-900/60 p-3 text-xs text-zinc-500">
                          <summary class="cursor-pointer font-medium text-zinc-300 hover:text-amber-300">Or paste rows from a spreadsheet</summary>
                          <p class="mt-2">Copy cells from Excel / Google Sheets / a CSV and paste them here. The first line is the header; tabs, commas or semicolons separate the columns. On the site the table becomes sortable, with filter chips for columns such as Type and a search box for long lists.</p>
                          <textarea class="input mt-2 min-h-24 font-mono text-xs" x-model="table.paste" placeholder="Name	Type	Price	Location	Description&#10;Wooden Sword	Sword	100 G	Truce	Starter blade"></textarea>
                          <button type="button" class="btn btn-sm mt-2" :disabled="!table.paste.trim()" @click="insertPastedTable()">Insert pasted table</button>
                        </details>
                      </div>
                      <div class="flex justify-end gap-2 border-t border-zinc-800 px-4 py-3">
                        <button type="button" class="btn btn-sm" @click="panel = null">Cancel</button>
                        <button type="submit" class="btn btn-sm btn-accent">Insert table</button>
                      </div>
                    </form>
                  </div>

                  <!-- Gallery dialog: upload (click or drop), insert into the text, arrange the gallery -->
                  <div x-show="panel === 'images'" x-cloak class="fixed inset-0 z-50 grid place-items-center p-4" @click.self="panel = null" role="dialog" aria-modal="true" aria-label="Gallery">
                    <div
                      class="card relative flex max-h-[85vh] w-full max-w-4xl flex-col overflow-hidden bg-zinc-950 shadow-2xl"
                      @dragover.prevent="dragging = true"
                      @dragleave="if (!$el.contains($event.relatedTarget)) dragging = false"
                      @drop.prevent="dragging = false; uploadAttachments($event)"
                    >
                      <!-- Drop overlay -->
                      <div x-show="dragging" x-cloak class="pointer-events-none absolute inset-0 z-10 grid place-items-center rounded-xl border-2 border-dashed border-amber-400 bg-zinc-950/90">
                        <p class="font-display text-2xl text-amber-300">Drop to upload</p>
                      </div>

                      <div class="flex items-center justify-between gap-3 border-b border-zinc-800 px-4 py-3">
                        <div class="min-w-0">
                          <p class="font-display text-xl text-zinc-100">Gallery</p>
                          <p class="truncate text-xs text-zinc-500">
                            <span x-text="attachments.length"></span> image(s) in <code class="text-zinc-300" x-text="`public/guides/${selected}/`"></code>
                            &middot; <span x-text="form.gallery.length"></span> in the gallery
                          </p>
                        </div>
                        <button type="button" class="btn btn-sm" @click="panel = null" aria-label="Close">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                      </div>

                      <div class="min-h-0 flex-1 space-y-5 overflow-y-auto p-4">
                        <!-- Dropzone -->
                        <label class="flex cursor-pointer flex-col items-center justify-center gap-1 rounded-xl border-2 border-dashed border-zinc-700 px-4 py-6 text-center transition hover:border-amber-400/60 hover:bg-zinc-900/60" :class="uploading && 'pointer-events-none opacity-60'">
                          <input type="file" class="hidden" multiple accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" :disabled="uploading" @change="uploadAttachments($event)" />
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="size-7 text-amber-400"><path d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" /></svg>
                          <span class="text-sm font-medium text-zinc-200" x-text="uploading ? 'Uploading...' : 'Drop images here, or click to browse'"></span>
                          <span class="text-xs text-zinc-500">PNG, JPEG, WebP, GIF or SVG, up to 15 MB each. Served at <code x-text="`/guides/${selected}/...`"></code></span>
                        </label>

                        <!-- Uploaded images -->
                        <section x-show="attachments.length">
                          <p class="label">Images</p>
                          <ul class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">
                            <template x-for="f in attachments" :key="f.name">
                              <li class="group overflow-hidden rounded-lg border border-zinc-800 bg-zinc-900">
                                <div class="relative aspect-[4/3] bg-zinc-950">
                                  <img :src="f.url" alt="" class="h-full w-full object-cover" loading="lazy" />
                                  <span x-show="inGallery(f)" class="absolute left-1.5 top-1.5 rounded-full bg-amber-400 px-1.5 py-0.5 text-[10px] font-semibold text-zinc-950">In gallery</span>
                                </div>
                                <div class="p-2">
                                  <p class="truncate text-xs font-medium text-zinc-200" x-text="f.name" :title="f.name"></p>
                                  <p class="text-[11px] text-zinc-500" x-text="`${Math.round(f.size / 1024)} KB`"></p>
                                  <div class="mt-2 flex gap-1">
                                    <button type="button" class="btn btn-sm flex-1" @click="insertImage(f)" title="Insert into the text at the cursor">Insert</button>
                                    <button type="button" class="btn btn-sm flex-1" :disabled="inGallery(f)" @click="addToGallery(f)" title="Add to the gallery shown above the text">+ Gallery</button>
                                    <button type="button" class="btn btn-sm btn-danger px-1.5" @click="deleteAttachment(f)" title="Delete this file">
                                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-3.5"><path d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
                                    </button>
                                  </div>
                                </div>
                              </li>
                            </template>
                          </ul>
                        </section>

                        <!-- Gallery order -->
                        <section>
                          <div class="mb-1 flex items-baseline justify-between gap-2">
                            <p class="label">Gallery order</p>
                            <p class="text-xs text-zinc-500">Shown above the text with a lightbox, in this order</p>
                          </div>
                          <p x-show="!form.gallery.length" class="rounded-lg border border-dashed border-zinc-800 px-3 py-4 text-center text-sm text-zinc-500">Nothing in the gallery yet - use <span class="text-zinc-300">+ Gallery</span> on an image above. Good for a set of maps: give each one the area name.</p>
                          <datalist id="gallery-category-suggestions">
                            <template x-for="c in galleryCategories" :key="c"><option :value="c"></option></template>
                          </datalist>
                          <ol x-show="form.gallery.length" class="divide-y divide-zinc-800 overflow-hidden rounded-lg border border-zinc-800 bg-zinc-900">
                            <template x-for="(g, i) in form.gallery" :key="g.src">
                              <li class="flex items-center gap-2 p-2">
                                <span class="w-5 text-right font-mono text-xs text-zinc-600" x-text="i + 1"></span>
                                <img :src="g.src" alt="" class="size-10 shrink-0 rounded bg-zinc-950 object-cover" loading="lazy" />
                                <input class="input" x-model="g.title" placeholder="Title (e.g. Guardia Forest)" required />
                                <input class="input" x-model="g.caption" placeholder="Caption (optional)" />
                                <input class="input sm:w-40" x-model.trim="g.category" list="gallery-category-suggestions" placeholder="Category" title="Groups the gallery into sections on the site (Overworld, Towns, Dungeons...). Leave empty for no section." />
                                <button type="button" class="btn btn-sm" :disabled="i === 0" @click="move(form.gallery, i, i - 1)" title="Move up">&uarr;</button>
                                <button type="button" class="btn btn-sm" :disabled="i === form.gallery.length - 1" @click="move(form.gallery, i, i + 1)" title="Move down">&darr;</button>
                                <button type="button" class="btn btn-sm btn-danger" @click="form.gallery.splice(i, 1)" title="Remove from the gallery (keeps the file)">&times;</button>
                              </li>
                            </template>
                          </ol>
                        </section>
                      </div>

                      <div class="flex items-center justify-between gap-2 border-t border-zinc-800 px-4 py-3">
                        <a x-show="attachments.length" :href="`/api/guides/${selected}/gallery.zip`" class="btn btn-sm" download title="Zip of the gallery images (or all images if the gallery is empty) - attach it to a GitHub release and add it under Downloads">Download zip</a>
                        <span x-show="!attachments.length"></span>
                        <button type="button" class="btn btn-sm" @click="panel = null">Done</button>
                      </div>
                    </div>
                  </div>

                  <!-- Link dialog -->
                  <div x-show="panel === 'link'" x-cloak class="fixed inset-0 z-50 grid place-items-center p-4" @click.self="panel = null" role="dialog" aria-modal="true" aria-label="Link to a guide">
                    <div class="card flex max-h-[85vh] w-full max-w-2xl flex-col overflow-hidden bg-zinc-950 shadow-2xl">
                      <div class="flex items-center justify-between border-b border-zinc-800 px-4 py-3">
                        <p class="font-display text-xl text-zinc-100">Insert a link</p>
                        <button type="button" class="btn btn-sm" @click="panel = null" aria-label="Close">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                      </div>
                      <div class="min-h-0 flex-1 overflow-y-auto p-4">
                        <div class="mb-4 inline-flex rounded-lg border border-zinc-800 bg-zinc-950/60 p-1 text-sm" role="tablist" aria-label="Kind of link">
                          <button type="button" role="tab" class="rounded-md px-3 py-1.5 font-medium transition" :class="linkMode === 'guide' ? 'bg-zinc-800 text-amber-300' : 'text-zinc-400 hover:text-zinc-200'" :aria-selected="linkMode === 'guide'" @click="linkMode = 'guide'">One of my guides</button>
                          <button type="button" role="tab" class="rounded-md px-3 py-1.5 font-medium transition" :class="linkMode === 'external' ? 'bg-zinc-800 text-amber-300' : 'text-zinc-400 hover:text-zinc-200'" :aria-selected="linkMode === 'external'" @click="linkMode = 'external'">Another site</button>
                        </div>

                        <form x-show="linkMode === 'external'" class="space-y-3" @submit.prevent="insertExternalLink()">
                          <label class="field">
                            <span class="label">URL *</span>
                            <input class="input" x-model.trim="linkUrl" placeholder="vgmaps.de/maps/nes/dragon-warrior" required />
                          </label>
                          <label class="field">
                            <span class="label">Link text</span>
                            <input class="input" x-model="linkText" placeholder="Leave empty to use the address" />
                          </label>
                          <p class="text-xs text-zinc-500">
                            Inserted as <code class="text-zinc-300" x-text="`[${linkText.trim() || (linkUrlNormalised || 'https://example.com').replace(/^https?:\/\//i, '')}](${linkUrlNormalised || 'https://example.com'})`"></code>.
                            Addresses without a scheme get <code class="text-zinc-300">https://</code>. Links off this site open in a new tab and show a small arrow.
                          </p>
                          <div class="flex justify-end gap-2">
                            <button type="button" class="btn btn-sm" @click="panel = null">Cancel</button>
                            <button type="submit" class="btn btn-sm btn-accent" :disabled="!linkUrlNormalised">Insert link</button>
                          </div>
                        </form>

                        <div x-show="linkMode === 'guide'">
                        <div class="flex flex-wrap items-center gap-2">
                          <select class="input sm:flex-1" x-model="linkGuide" @change="loadHeadings()">
                            <option value="">Choose a guide...</option>
                            <template x-for="g in linkGuides" :key="g.slug"><option :value="g.slug" x-text="`${g.title}${g.game ? ' - ' + g.game : ''}`"></option></template>
                          </select>
                          <button type="button" class="btn btn-sm" :disabled="!linkGuide" @click="insertLink(); panel = null">Link to the guide</button>
                        </div>
                        <p class="mt-3 text-xs text-zinc-500" x-show="linkGuide">...or link straight to one of its sections:</p>
                        <p x-show="linkGuide && !linkHeadings.length" class="mt-2 text-xs text-zinc-500">That guide has no headings yet.</p>
                        <ul x-show="linkHeadings.length" class="mt-2 flex flex-wrap gap-1">
                          <template x-for="h in linkHeadings" :key="h.slug">
                            <li>
                              <button type="button" class="btn btn-sm" :class="h.depth > 2 && 'opacity-80'" @click="insertLink(h); panel = null" :title="'#' + h.slug">
                                <span x-text="'#'.repeat(h.depth) + ' ' + h.text"></span>
                              </button>
                            </li>
                          </template>
                        </ul>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Downloads dialog -->
                  <div x-show="panel === 'downloads'" x-cloak class="fixed inset-0 z-50 grid place-items-center p-4" @click.self="panel = null" role="dialog" aria-modal="true" aria-label="Downloads">
                    <div class="card flex max-h-[85vh] w-full max-w-3xl flex-col overflow-hidden bg-zinc-950 shadow-2xl">
                      <div class="flex items-center justify-between border-b border-zinc-800 px-4 py-3">
                        <p class="font-display text-xl text-zinc-100">Downloads</p>
                        <button type="button" class="btn btn-sm" @click="panel = null" aria-label="Close">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                      </div>
                      <div class="min-h-0 flex-1 overflow-y-auto p-4">
                        <p class="text-xs text-zinc-500">Shown as buttons in the guide's sidebar. For big files (a zip of all maps) upload the file to a GitHub release and paste the asset URL here - it is served by GitHub, not Vercel, and stays out of git history.</p>
                        <div class="mt-3 space-y-2">
                          <template x-for="(dl, i) in form.downloads" :key="i">
                            <div class="flex flex-wrap items-center gap-2">
                              <input class="input sm:w-48" x-model="dl.label" placeholder="Label (e.g. All maps, zip)" required />
                              <input class="input flex-1" x-model="dl.url" placeholder="https://github.com/.../releases/download/v1/maps.zip" required />
                              <input class="input sm:w-32" x-model="dl.note" placeholder="Note (12 MB)" />
                              <button type="button" class="btn btn-sm btn-danger" @click="form.downloads.splice(i, 1)">&times;</button>
                            </div>
                          </template>
                        </div>
                        <button type="button" class="btn btn-sm mt-3" @click="form.downloads.push({ label: '', url: '', note: '' })">+ Add download</button>
                      </div>
                    </div>
                  </div>



                  <!-- Sources dialog: who to credit for material that is not mine, and the removal trail -->
                  <div x-show="panel === 'sources'" x-cloak class="fixed inset-0 z-50 grid place-items-center p-4" @click.self="panel = null" role="dialog" aria-modal="true" aria-label="Sources">
                    <div class="card flex max-h-[85vh] w-full max-w-3xl flex-col overflow-hidden bg-zinc-950 shadow-2xl">
                      <div class="flex items-center justify-between border-b border-zinc-800 px-4 py-3">
                        <p class="font-display text-xl text-zinc-100">Sources &amp; credits</p>
                        <button type="button" class="btn btn-sm" @click="panel = null" aria-label="Close">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                      </div>
                      <div class="min-h-0 flex-1 overflow-y-auto p-4">
                        <p class="text-xs leading-relaxed text-zinc-500">
                          Anything on this page you did not make yourself: a map archive, a wiki, a fan site whose tables you re-typed.
                          Each one is credited in a block at the end of the guide, next to a link that lets its owner ask for it to be
                          taken down, and is collected on <code class="text-zinc-300">/credits</code>. Leave this empty when the page is all yours.
                        </p>
                        <div class="mt-3 space-y-2">
                          <template x-for="(src, i) in form.sources" :key="i">
                            <div class="rounded-lg border border-zinc-800 bg-zinc-900/40 p-3">
                              <div class="flex flex-wrap items-center gap-2">
                                <input class="input sm:w-56" x-model="src.label" placeholder="Who to credit (Better VGMaps)" required />
                                <input class="input flex-1" x-model="src.url" placeholder="https://... (optional)" />
                                <input class="input sm:w-40" x-model="src.license" :list="'licenses-' + i" placeholder="Licence (optional)" />
                                <datalist :id="'licenses-' + i">
                                  <template x-for="name in licenseSuggestions" :key="name"><option :value="name"></option></template>
                                </datalist>
                                <button type="button" class="btn btn-sm btn-danger" @click="form.sources.splice(i, 1)" aria-label="Remove source">&times;</button>
                              </div>
                              <input class="input mt-2 w-full" x-model="src.note" placeholder="What was taken, and from whom (Maps drawn by Chiasm and Rick Bruns)" />
                            </div>
                          </template>
                        </div>
                        <button type="button" class="btn btn-sm mt-3" @click="addSource()">+ Add source</button>
                      </div>
                    </div>
                  </div>

                  <textarea x-show="!preview" x-ref="body" class="min-h-[32rem] w-full resize-y bg-transparent p-4 font-mono text-sm leading-relaxed text-zinc-100 focus:outline-none" x-model="form.body" placeholder="Write markdown here. GitHub-flavored: tables, task lists and footnotes all work. Use the Template button for the walkthrough skeleton."></textarea>
                  <div x-show="preview" class="preview-prose p-6" x-html="rendered"></div>
                </div>
              </form>
            </template>
          </div>
        </section>
      </template>

      <!-- ===== Trackers ===== -->
      <template x-if="$store.app.ready && $store.app.view === 'trackers'">
        <section x-data="trackersView" class="grid gap-6" :class="!($store.app.listHidden && form) && 'xl:grid-cols-[320px_1fr]'">
          <div class="card flex max-h-[calc(100vh-4rem)] flex-col" x-show="!($store.app.listHidden && form)">
            <div class="flex items-center justify-between border-b border-zinc-800 px-3 py-3">
              <h1 class="h-display text-2xl">Trackers <span class="font-sans text-base text-zinc-500" x-text="`(${trackers.length})`"></span></h1>
              <button type="button" class="btn btn-sm btn-accent" @click="create()">+ New</button>
            </div>
            <div class="border-b border-zinc-800 p-3"><input type="search" class="input" placeholder="Search..." x-model="q" /></div>
            <ul class="flex-1 overflow-y-auto">
              <template x-for="t in filtered" :key="t.slug">
                <li>
                  <button type="button" class="row" :class="selected === t.slug && 'row-active'" @click="open(t.slug)">
                    <span class="min-w-0 flex-1">
                      <span class="block truncate font-medium text-zinc-100" x-text="t.title"></span>
                      <span class="block truncate text-xs text-zinc-500"><span x-text="t.game || 'no game'"></span> &middot; <span x-text="`${progress(t).done}/${progress(t).total}`"></span></span>
                    </span>
                    <span class="chip shrink-0" :class="$store.app.chip($store.app.trackerType(t.type).color)" x-text="$store.app.trackerType(t.type).label"></span>
                  </button>
                </li>
              </template>
              <li x-show="filtered.length === 0" class="p-6 text-center text-sm text-zinc-500">No trackers yet.</li>
            </ul>
          </div>

          <div>
            <template x-if="!form">
              <div class="card flex h-64 flex-col items-center justify-center gap-2 text-center text-zinc-500">
                <p class="font-display text-2xl text-zinc-300">Pick a tracker or start one</p>
                <p class="text-sm">Trackers are checklists: missables, collectibles, side quests, bosses. Tick items as you play; visitors can track their own copy too.</p>
                <button type="button" class="btn btn-accent mt-2" @click="create()">+ New tracker</button>
              </div>
            </template>

            <template x-if="form">
              <form class="space-y-4" @submit.prevent="save()">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 class="text-2xl font-bold tracking-tight text-zinc-50" x-text="isNew ? 'New tracker' : form.title"></h2>
                    <p class="text-xs text-zinc-500">
                      <code class="text-zinc-300" x-text="`src/content/trackers/${isNew ? slugPreview : selected}.json`"></code>
                      <span class="ml-2" x-text="`${progress(form).done}/${progress(form).total} done (${progress(form).pct}%)`"></span>
                      <span x-show="dirty" class="ml-2 text-amber-300">&bull; unsaved</span>
